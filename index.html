14:{q:'Hur väl känner du till planerna på möjliga förändringar av detta köpcentrum eller området runt omkring?',o:['Jag känner väl till planerna','Jag har hört talas om planerna men vet lite','Jag har inte hört talas om planerna','Osäker']},
15:{q:'Om du känner till planerna, hur tillgänglig och begriplig var informationen om dem?',o:['Mycket tillgänglig och begriplig','Ganska tillgänglig och begriplig','Varken tillgänglig eller otillgänglig','Ganska otillgänglig eller oklar','Helt otillgänglig eller oklar','Jag känner inte till planerna','Vet inte']},
16:{q:'Hur bedömer du invånares och företagares möjligheter att påverka besluten om områdets framtid?',o:['De kan påverka i hög grad','De kan påverka i viss mån','De kan bara påverka obetydligt','De kan i praktiken inte påverka alls','Vet inte']},
17:{q:'Om du har deltagit i diskussioner om områdets framtid, i vilken mån upplevde du att din åsikt blev hörd?',o:['Min åsikt beaktades i hög grad','Min åsikt beaktades delvis','Min åsikt hördes, men jag vet inte om den påverkade besluten','Min åsikt beaktades inte','Jag deltog, men kan inte bedöma resultatet','Jag har inte deltagit i diskussioner','Jag visste inte att jag kunde delta']},
18:{q:'Hur skulle du helst vilja delta i diskussionen om områdets framtid?',h:'Du kan välja flera alternativ.',o:['Webbenkäter','Öppna möten och offentliga diskussioner','Diskussioner på flera språk','Arbetsgrupper med invånare och företagare','Samråd direkt i köpcentret','Korta intervjuer med invånare och besökare','Information och möjlighet att lämna synpunkter online','Jag vill inte delta','Annat sätt']},
19:{q:'Vilket resultat av förändringarna skulle vara mest acceptabelt för dig?',o:['Ett modernt köpcentrum med nya butiker och tjänster','En trivsammare offentlig miljö med grönområden och mötesplatser','Bevarande av nuvarande butiker och kulturell mångfald','En kombination av modernisering och bevarande av lokala företag och områdets identitet','Bevarande av nuläget med mindre förbättringar','Annat resultat','Vet inte']},
20:{q:'Vad anser du är särskilt viktigt för stadens myndigheter och andra aktörer i planeringen att ta hänsyn till när de fattar beslut om området?'},
21:{q:'Vilken åldersgrupp tillhör du?',o:['Under 18','18–29','30–44','45–59','60 eller äldre','Vill inte svara']},
22:{q:'På vilket språk eller vilka språk skulle du helst vilja få information om stadsplanering?',h:'Du kan välja flera alternativ.',o:['Finska','Svenska','Engelska','Ryska','Estniska','Ukrainska','Somaliska','Arabiska','Hindi','Kinesiska (mandarin)','Persiska (farsi)','Dari','Pashto','Tagalog (filippinska)','Albanska','Kurdiska','Turkiska','Vietnamesiska','Thailändska','Spanska','Bengali','Annat språk']},
23:{q:'Vilket eller vilka språk talar du vanligtvis hemma?'}}};

T.en={ui:{title:'Survey of residents and visitors on the future of local shopping centres',intro:'This survey is anonymous and voluntary. There are no right or wrong answers: we are interested in your personal opinion. You can skip any question and stop at any time. “Changes” means possible changes to buildings, shops, public spaces, infrastructure and the functions of the area. It does not mean that all of the changes listed will be carried out.',start:'Start',next:'Next',back:'Back',finish:'Finish',other:'Please specify',max:'Select up to {n}',thanks:'Thank you for taking part! Your answers will help us better understand the needs of people who live near this area, work here or visit it regularly.',copy:'Copy answers',opt:'optional question'},
s1:['1 — strongly disagree','2 — somewhat disagree','3 — neither agree nor disagree','4 — somewhat agree','5 — strongly agree','Don’t know'],
s2:['1 — not worried at all','2 — not very worried','3 — somewhat worried','4 — very worried','5 — extremely worried','I don’t expect this outcome','Don’t know'],
q:{1:{q:'Which shopping centre or area are you interested in?',o:['Puhos Shopping Centre, Helsinki','Kontula Shopping Centre, Helsinki','Itis Shopping Centre, Helsinki','Mall of Tripla, Helsinki','Hakunila Shopping Centre, Vantaa','Myyrmanni Shopping Centre, Vantaa','Jumbo Shopping Centre, Vantaa','Entresse Shopping Centre, Espoo','Sello Shopping Centre, Espoo','Iso Omena Shopping Centre, Espoo']},
2:{q:'How often do you visit this shopping centre or the surrounding area?',o:['Every day or almost every day','A few times a week','A few times a month','Less than once a month','This is my first visit']},
3:{q:'How are you connected to this place?',h:'You can select several options.',o:['I live nearby','I work nearby','I own a local business','I work in a local shop, café or other business','I regularly buy goods or use services here','I use the public spaces or attend events','I study nearby','Other']},
4:{q:'How long have you lived, worked or regularly spent time in this area?',o:['Less than a year','1 to 5 years','More than 5 years','I do not live or work nearby, but I visit this place','Don’t know']},
5:{q:'Overall, how satisfied are you with the current state of the shopping centre and the surrounding area?',o:['1 — not at all satisfied','2 — somewhat dissatisfied','3 — neither satisfied nor dissatisfied','4 — somewhat satisfied','5 — completely satisfied','Don’t know']},
6:{q:'What makes this place special or important to you personally?',o:['It has shops and products that are hard to find elsewhere','I can get services or communicate in a language I am comfortable with','It brings together different cultures, cuisines and traditions','I meet friends, acquaintances or neighbours here','It is an important place in my everyday life','Small independent businesses operate here','Goods and services are affordable here','I like the architecture, atmosphere or layout of the space','Interesting events or cultural activities take place here','This place has no particular meaning for me','Other']},
7:{q:'How much do you agree with the following statements?',r:['This place is important for the everyday life of the local community.','Cultural and linguistic diversity is a valuable feature of this place.','I feel a connection to this place.','This place allows people with different life experiences to meet and interact.','When the area changes, it is important to take into account the needs of the people who use it now.']},
8:{q:'How much do you support changes to the shopping centre and surrounding area if they aim to improve buildings, public spaces and local services?',o:['Fully support','Somewhat support','Neither support nor oppose','Somewhat oppose','Strongly oppose','I do not have enough information to answer']},
9:{q:'Which changes would you like to see first?',o:['Renovation and improvement of existing buildings','New shops, cafés and restaurants','Keeping small independent shops and affordable commercial rents','More green areas, trees and places to relax','More convenient walking routes and cycling infrastructure','Safer and more comfortable public space','More places for meetings, events and cultural activities','New housing near the shopping centre','Better public transport and accessibility of the area','Better accessibility for people with reduced mobility','Keeping the current look and atmosphere','No major changes are needed','Other']},
10:{q:'What is especially important to preserve if changes take place?',h:'You can select several options.',o:['Current shops, cafés and restaurants','Small independent businesses','Affordable prices for goods and services','Cultural and linguistic diversity','Historic architecture and appearance','Places to meet and socialise','Services I use regularly','Jobs and opportunities for local business','Convenient location and transport access','None of the above','Other']},
11:{q:'How worried are you about the following possible consequences of changes?',r:['Rising prices of goods and services.','Rising rents for local businesses.','Closure of familiar shops and restaurants.','A decrease in the number of small independent businesses.','Loss of cultural and linguistic diversity.','Loss of places where people meet and socialise.','Insufficient participation of residents and entrepreneurs in decision-making.','Noise, dust and temporary inconvenience during construction work.','Increased pressure on transport and local infrastructure.','Worsening accessibility of the area for certain groups of people.']},
12:{q:'Imagine that after renewal there will be new buildings and more comfortable public spaces, but some of the current shops may close. Which approach would you prefer?',o:['Support renewal even if some of the current shops close','Support renewal if there are measures to protect existing businesses','Renew the area gradually, trying to keep most of the current shops','Prefer keeping the current state with minor improvements','Don’t know','Other approach']},
13:{q:'What measures should be considered if changes raise costs for local businesses or make it difficult for them to continue operating?',o:['Provide premises with affordable rent for local businesses','Offer existing businesses alternative premises nearby','Carry out the work in phases so that businesses can keep operating','Provide support for entrepreneurs who have to relocate','No special measures: businesses should operate on general market terms','Such measures are not needed','Don’t know','Other']},
14:{q:'How familiar are you with the plans for possible changes to this shopping centre or the surrounding area?',o:['I am well aware of the plans','I have heard of the plans but know little','I have not heard of the plans','Not sure']},
15:{q:'If you are familiar with the plans, how accessible and understandable was the information about them?',o:['Very accessible and understandable','Somewhat accessible and understandable','Neither accessible nor inaccessible','Somewhat inaccessible or unclear','Completely inaccessible or unclear','I am not familiar with the plans','Don’t know']},
16:{q:'How do you assess the opportunities of residents and entrepreneurs to influence decisions about the future of this area?',o:['They can influence decisions significantly','They can influence decisions to some extent','They can influence decisions only slightly','They can hardly influence decisions at all','Don’t know']},
17:{q:'If you have taken part in discussions about the future of this area, to what extent did you feel your opinion was heard?',o:['My opinion was taken into account to a great extent','My opinion was partly taken into account','My opinion was heard, but I do not know whether it affected the decisions','My opinion was not taken into account','I took part, but cannot assess the result','I have not taken part in discussions','I was not aware of the opportunity to take part']},
18:{q:'How would you prefer to take part in discussions about the future of this area?',h:'You can select several options.',o:['Online surveys','Open meetings and public discussions','Discussions in several languages','Working groups with residents and entrepreneurs','Consultations directly in the shopping centre','Short interviews with residents and visitors','Information and the chance to give feedback online','I do not want to take part','Other way']},
19:{q:'Which outcome of the changes would be most acceptable to you?',o:['A modern shopping centre with new shops and services','A more comfortable public space with green areas and meeting places','Keeping the current shops and cultural diversity','A combination of modernisation with preserving local businesses and the identity of the area','Keeping the current state with minor improvements','Other outcome','Don’t know']},
20:{q:'In your opinion, what is especially important for city authorities and other planning participants to take into account when making decisions about this area?'},
21:{q:'Which age group are you in?',o:['Under 18','18–29','30–44','45–59','60 or older','I prefer not to answer']},
22:{q:'In which language or languages would you prefer to receive information about urban planning?',h:'You can select several options.',o:['Finnish','Swedish','English','Russian','Estonian','Ukrainian','Somali','Arabic','Hindi','Chinese (Mandarin)','Persian (Farsi)','Dari','Pashto','Tagalog (Filipino)','Albanian','Kurdish','Turkish','Vietnamese','Thai','Spanish','Bengali','Other language']},
23:{q:'Which language or languages do you usually speak at home?'}}};

T.ru={ui:{title:'Опрос жителей и посетителей о будущем местных торговых центров',intro:'Опрос анонимный и добровольный. Правильных или неправильных ответов нет: нам важно ваше мнение. Любой вопрос можно пропустить, а участие — прекратить в любой момент. «Изменения» — это возможные изменения зданий, магазинов, общественных пространств и инфраструктуры; это не значит, что все они будут реализованы.',start:'Начать',next:'Далее',back:'Назад',finish:'Завершить',other:'Укажите',max:'Не более {n}',thanks:'Спасибо за участие! Ваши ответы помогут лучше понять потребности людей, которые живут рядом с этой территорией, работают здесь или регулярно её посещают.',copy:'Скопировать ответы',opt:'необязательный вопрос'},
s1:['1 — совершенно не согласен(на)','2 — скорее не согласен(на)','3 — ни согласен(на), ни не согласен(на)','4 — скорее согласен(на)','5 — полностью согласен(на)','Затрудняюсь ответить'],
s2:['1 — совсем не беспокоит','2 — скорее не беспокоит','3 — в некоторой степени беспокоит','4 — сильно беспокоит','5 — очень сильно беспокоит','Не ожидаю такого последствия','Затрудняюсь ответить'],
q:{1:{q:'Какой торговый центр или территория вас интересует?',o:['Торговый центр «Пухос» (Puhos), Хельсинки','Торговый центр «Контула» (Kontula), Хельсинки','Торговый центр «Итис» (Itis), Хельсинки','Торговый центр «Молл Трипла» (Mall of Tripla), Хельсинки','Торговый центр «Хакунила» (Hakunila), Вантаа','Торговый центр «Мюрмянни» (Myyrmanni), Вантаа','Торговый центр «Юмбо» (Jumbo), Вантаа','Торговый центр «Энтрессе» (Entresse), Эспоо','Торговый центр «Селло» (Sello), Эспоо','Торговый центр «Исо-Омена» (Iso Omena), Эспоо']},
2:{q:'Как часто вы посещаете этот торговый центр или окружающую территорию?',o:['Каждый день или почти каждый день','Несколько раз в неделю','Несколько раз в месяц','Реже, чем раз в месяц','Я здесь впервые']},
3:{q:'Как вы связаны с этим местом?',h:'Можно выбрать несколько вариантов.',o:['Живу поблизости','Работаю поблизости','Владею местным бизнесом','Работаю в местном магазине, кафе или другом предприятии','Регулярно покупаю здесь товары или пользуюсь услугами','Использую общественные пространства или посещаю мероприятия','Учусь поблизости','Другое']},
4:{q:'Как долго вы живёте, работаете или регулярно проводите время в этом районе?',o:['Менее года','От 1 до 5 лет','Более 5 лет','Я не живу и не работаю поблизости, но посещаю это место','Затрудняюсь ответить']},
5:{q:'Насколько вы в целом довольны нынешним состоянием торгового центра и окружающей территории?',o:['1 — совсем не доволен(на)','2 — скорее не доволен(на)','3 — ни доволен(на), ни не доволен(на)','4 — скорее доволен(на)','5 — полностью доволен(на)','Затрудняюсь ответить']},
6:{q:'Что делает это место особенным или важным лично для вас?',o:['Здесь есть магазины и товары, которые трудно найти в других местах','Здесь можно получить услуги или общаться на удобном мне языке','Здесь представлены разные культуры, кухни и традиции','Здесь я встречаю друзей, знакомых или соседей','Это важное место для моей повседневной жизни','Здесь работают небольшие независимые предприятия','Здесь доступны по цене товары и услуги','Мне нравятся архитектура, атмосфера или организация пространства','Здесь проходят интересные мероприятия или культурные события','Для меня это место не имеет особого значения','Другое']},
7:{q:'Насколько вы согласны со следующими утверждениями?',r:['Это место важно для повседневной жизни местного сообщества.','Культурное и языковое разнообразие является ценным качеством этого места.','Я чувствую связь с этим местом.','Это место позволяет людям с разным жизненным опытом встречаться и взаимодействовать.','При изменении территории важно учитывать потребности людей, которые пользуются ею сейчас.']},
8:{q:'Насколько вы поддерживаете изменения торгового центра и окружающей территории, если они будут направлены на улучшение зданий, общественных пространств и местных услуг?',o:['Полностью поддерживаю','Скорее поддерживаю','Ни поддерживаю, ни не поддерживаю','Скорее не поддерживаю','Совершенно не поддерживаю','Мне недостаточно информации, чтобы ответить']},
9:{q:'Какие изменения вы хотели бы видеть в первую очередь?',o:['Ремонт и улучшение существующих зданий','Новые магазины, кафе и рестораны','Сохранение небольших независимых магазинов и доступной коммерческой аренды','Больше зелёных зон, деревьев и мест для отдыха','Более удобные пешеходные маршруты и велосипедная инфраструктура','Более безопасное и комфортное общественное пространство','Больше мест для встреч, мероприятий и культурных событий','Новое жильё рядом с торговым центром','Улучшение общественного транспорта и доступности территории','Улучшение доступности для людей с ограниченной мобильностью','Сохранение нынешнего облика и атмосферы','Никаких существенных изменений не требуется','Другое']},
10:{q:'Что особенно важно сохранить при возможных изменениях?',h:'Можно выбрать несколько вариантов.',o:['Нынешние магазины, кафе и рестораны','Небольшие независимые предприятия','Доступные цены на товары и услуги','Культурное и языковое разнообразие','Историческую архитектуру и внешний облик','Места встреч и общения','Услуги, которыми я регулярно пользуюсь','Рабочие места и возможности для местного бизнеса','Удобство расположения и транспортную доступность','Ничего из перечисленного','Другое']},
11:{q:'Насколько вас беспокоят следующие возможные последствия изменений?',r:['Рост цен на товары и услуги.','Рост арендной платы для местных предприятий.','Закрытие привычных магазинов и ресторанов.','Сокращение числа небольших независимых предприятий.','Потеря культурного и языкового разнообразия.','Утрата мест, где люди встречаются и общаются.','Недостаточное участие жителей и предпринимателей в принятии решений.','Шум, пыль и временные неудобства во время строительных работ.','Увеличение нагрузки на транспорт и местную инфраструктуру.','Ухудшение доступности территории для отдельных групп населения.']},
12:{q:'Представьте, что после обновления появятся новые здания и более комфортные общественные пространства, но часть нынешних магазинов может закрыться. Какой подход вы предпочли бы?',o:['Поддержать обновление, даже если часть нынешних магазинов закроется','Поддержать обновление при наличии мер защиты действующих предприятий','Проводить обновление постепенно, стараясь сохранить большинство нынешних магазинов','Предпочесть сохранение нынешнего состояния с небольшими улучшениями','Затрудняюсь ответить','Другой вариант']},
13:{q:'Какие меры следует рассмотреть, если изменения повысят расходы местных предприятий или затруднят продолжение их работы?',o:['Предусмотреть помещения с доступной арендой для местных предприятий','Предложить действующим предприятиям альтернативные помещения поблизости','Проводить работы поэтапно, чтобы предприятия могли продолжать работу','Предусмотреть поддержку предпринимателей, которым придётся переехать','Не вводить специальные меры: предприятия должны работать на общих рыночных условиях','Такие меры не нужны','Затрудняюсь ответить','Другое']},
14:{q:'Насколько вы знакомы с планами возможных изменений этого торгового центра или окружающей территории?',o:['Хорошо знаком(а) с планами','Слышал(а) о планах, но знаю мало','Не слышал(а) о планах','Не уверен(а)']},
15:{q:'Если вы знакомы с планами, насколько доступной и понятной была информация о них?',o:['Очень доступной и понятной','Скорее доступной и понятной','Ни доступной, ни недоступной','Скорее недоступной или непонятной','Совершенно недоступной или непонятной','Я не знаком(а) с планами','Затрудняюсь ответить']},
16:{q:'Как вы оцениваете возможности жителей и предпринимателей влиять на решения о будущем этой территории?',o:['Могут существенно влиять','Могут влиять в некоторой степени','Могут влиять лишь незначительно','Практически не могут влиять','Не знаю']},
17:{q:'Если вы участвовали в обсуждении будущего этой территории, насколько вы почувствовали, что ваше мнение было услышано?',o:['Моё мнение было учтено в значительной степени','Моё мнение было учтено частично','Моё мнение выслушали, но я не знаю, повлияло ли оно на решения','Моё мнение не было учтено','Я участвовал(а), но не могу оценить результат','Я не участвовал(а) в обсуждениях','Я не знал(а) о возможности участвовать']},
18:{q:'Каким образом вы предпочли бы участвовать в обсуждении будущего этой территории?',h:'Можно выбрать несколько вариантов.',o:['Онлайн-опросы','Открытые встречи и общественные обсуждения','Обсуждения на нескольких языках','Рабочие группы с участием жителей и предпринимателей','Консультации непосредственно в торговом центре','Короткие интервью с жителями и посетителями','Информация и возможность оставить отзыв онлайн','Я не хочу участвовать','Другой способ']},
19:{q:'Какой результат изменений был бы для вас наиболее приемлемым?',o:['Современный торговый центр с новыми магазинами и услугами','Более комфортное общественное пространство с зелёными зонами и местами встреч','Сохранение нынешних магазинов и культурного разнообразия','Сочетание модернизации с сохранением местных предприятий и идентичности района','Сохранение нынешнего состояния с небольшими улучшениями','Другой вариант','Затрудняюсь ответить']},
20:{q:'Что, по вашему мнению, городским властям и другим участникам планирования особенно важно учесть при принятии решений об этой территории?'},
21:{q:'В какой возрастной группе вы находитесь?',o:['До 18 лет','18–29 лет','30–44 года','45–59 лет','60 лет и старше','Не хочу отвечать']},

T.et={ui:{title:'Küsitlus elanikele ja külastajatele kohalike kaubanduskeskuste tulevikust',intro:'Küsitlus on anonüümne ja vabatahtlik. Õigeid ega valesid vastuseid pole: meid huvitab teie isiklik arvamus. Võite iga küsimuse vahele jätta ja osalemise igal ajal lõpetada. „Muudatused” tähendavad hoonete, kaupluste, avalike ruumide, taristu ja piirkonna funktsioonide võimalikke muutusi. See ei tähenda, et kõik loetletud muudatused ellu viiakse.',start:'Alusta',next:'Edasi',back:'Tagasi',finish:'Lõpeta',other:'Täpsustage',max:'Valige kuni {n}',thanks:'Aitäh osalemast! Teie vastused aitavad paremini mõista inimeste vajadusi, kes elavad selle piirkonna lähedal, töötavad siin või külastavad seda regulaarselt.',copy:'Kopeeri vastused',opt:'vabatahtlik küsimus'},
s1:['1 — ei nõustu üldse','2 — pigem ei nõustu','3 — ei nõustu ega ole vastu','4 — pigem nõustun','5 — nõustun täielikult','Raske öelda'],
s2:['1 — üldse ei muretse','2 — pigem ei muretse','3 — muretseb mõningal määral','4 — muretseb tugevalt','5 — muretseb väga tugevalt','Ma ei looda sellist tagajärge','Raske öelda'],
q:{1:{q:'Milline kaubanduskeskus või piirkond teid huvitab?',o:['Puhos kaubanduskeskus, Helsingi','Kontula kaubanduskeskus, Helsingi','Itis kaubanduskeskus, Helsingi','Mall of Tripla, Helsingi','Hakunila kaubanduskeskus, Vantaa','Myyrmanni kaubanduskeskus, Vantaa','Jumbo kaubanduskeskus, Vantaa','Entresse kaubanduskeskus, Espoo','Sello kaubanduskeskus, Espoo','Iso Omena kaubanduskeskus, Espoo']},
2:{q:'Kui sageli külastate seda kaubanduskeskust või selle ümbrust?',o:['Iga päev või peaaegu iga päev','Mitu korda nädalas','Paar korda kuus','Harvem kui kord kuus','Olen siin esimest korda']},
3:{q:'Kuidas olete selle kohaga seotud?',h:'Võite valida mitu varianti.',o:['Elan lähedal','Töötan lähedal','Omen kohalikku ettevõtet','Töötan kohalikus poes, kohvikus või muus ettevõttes','Ostan siin regulaarselt kaupu või kasutan teenuseid','Kasutan avalikke ruume või käin üritustel','Õpin lähedal','Muu']},
4:{q:'Kui kaua olete selles piirkonnas elanud, töötanud või regulaarselt aega veetnud?',o:['Vähem kui aasta','1–5 aastat','Üle 5 aasta','Ma ei ela ega tööta lähedal, kuid külastan seda kohta','Raske öelda']},
5:{q:'Kui rahul olete üldiselt kaubanduskeskuse ja ümbritseva piirkonna praeguse olukorraga?',o:['1 — üldse mitte rahul','2 — pigem rahulolematu','3 — ei ole rahul ega rahulolematu','4 — pigem rahul','5 — täiesti rahul','Raske öelda']},
6:{q:'Mis teeb selle koha teie jaoks isiklikult eriliseks või oluliseks?',o:['Siin on poode ja tooteid, mida on mujalt raske leida','Siin saan teenuseid või suhelda mulle sobivas keeles','Siin on esindatud erinevad kultuurid, köögid ja traditsioonid','Siin kohtun sõprade, tuttavate või naabritega','See on minu igapäevaelus oluline koht','Siin tegutsevad väikesed sõltumatud ettevõtted','Siin on kaubad ja teenused taskukohased','Mulle meeldivad ruumi arhitektuur, õhkkond või korraldus','Siin toimuvad huvitavad üritused või kultuurisündmused','Sellel kohal ei ole minu jaoks erilist tähendust','Muu']},
7:{q:'Kui palju nõustute järgmiste väidetega?',r:['See koht on oluline kohaliku kogukonna igapäevaelus.','Kultuuriline ja keeleline mitmekesisus on selle koha väärtuslik omadus.','Tunnen sidet selle kohaga.','See koht võimaldab erineva elukogemusega inimestel kohtuda ja suhelda.','Piirkonna muutumisel on oluline arvestada nende inimeste vajadustega, kes seda praegu kasutavad.']},
8:{q:'Kui palju toetate kaubanduskeskuse ja ümbritseva piirkonna muudatusi, kui need on suunatud hoonete, avalike ruumide ja kohalike teenuste parandamisele?',o:['Toetan täielikult','Pigem toetan','Ei toeta ega ole vastu','Pigem ei toeta','Olen täiesti vastu','Mul pole vastamiseks piisavalt teavet']},
9:{q:'Milliseid muudatusi soovite näha esmajärjekorras?',o:['Olemasolevate hoonete remont ja parandamine','Uued poed, kohvikud ja restoranid','Väikeste sõltumatute poodide ja taskukohase äriruumide rendi säilitamine','Rohkem haljasalasid, puid ja puhkekohti','Mugavamad jalgteed ja jalgrattataristu','Turvalisem ja mugavam avalik ruum','Rohkem kohti kohtumisteks, üritusteks ja kultuurisündmusteks','Uued elamud kaubanduskeskuse lähedal','Parem ühistransport ja piirkonna ligipääsetavus','Parem juurdepääs piiratud liikumisvõimega inimestele','Praeguse ilme ja õhkkonna säilitamine','Olulisi muudatusi ei ole vaja','Muu']},
10:{q:'Mida on võimalike muudatuste korral eriti oluline säilitada?',h:'Võite valida mitu varianti.',o:['Praegused poed, kohvikud ja restoranid','Väikesed sõltumatud ettevõtted','Taskukohased hinnad kaupadele ja teenustele','Kultuuriline ja keeleline mitmekesisus','Ajalooline arhitektuur ja välimus','Kohtumis- ja suhtlemiskohad','Teenused, mida kasutan regulaarselt','Töökohad ja võimalused kohalikule ettevõtlusele','Mugav asukoht ja transpordiühendus','Mitte midagi loetletust','Muu']},
11:{q:'Kui palju muretsete järgmiste muudatuste võimalike tagajärgede pärast?',r:['Kaupade ja teenuste hindade tõus.','Kohalike ettevõtete üürihindade tõus.','Harjumuspäraste poodide ja restoranide sulgemine.','Väikeste sõltumatute ettevõtete arvu vähenemine.','Kultuurilise ja keelelise mitmekesisuse kadumine.','Kohtumis- ja suhtlemiskohtade kadumine.','Elanike ja ettevõtjate ebapiisav osalemine otsuste tegemisel.','Müra, tolm ja ajutised ebamugavused ehitustööde ajal.','Transpordi ja kohaliku taristu koormuse kasv.','Piirkonna ligipääsetavuse halvenemine teatud rühmadele.']},
12:{q:'Kujutage ette, et pärast uuendamist tekivad uued hooned ja mugavamad avalikud ruumid, kuid osa praegustest poodidest võib sulguda. Millist lähenemist eelistaksite?',o:['Toetada uuendamist, isegi kui osa praegustest poodidest sulgub','Toetada uuendamist, kui olemasolevate ettevõtete kaitseks on meetmeid','Uuendada järk-järgult, püüdes säilitada enamikku praegustest poodidest','Eelistada praeguse olukorra säilitamist väikeste parandustega','Raske öelda','Muu variant']},
13:{q:'Milliseid meetmeid tuleks kaaluda, kui muudatused tõstavad kohalike ettevõtete kulusid või raskendavad nende töö jätkamist?',o:['Pakkuda kohalikele ettevõtetele taskukohase rendiga ruume','Pakkuda olemasolevatele ettevõtetele alternatiivseid ruume lähedal','Teha töid etapiviisiliselt, et ettevõtted saaksid tegevust jätkata','Toetada ettevõtjaid, kes peavad ümber kolima','Erimeetmeid ei kehtestata: ettevõtted peavad tegutsema üldistel turutingimustel','Selliseid meetmeid ei ole vaja','Raske öelda','Muu']},
14:{q:'Kui hästi olete kursis selle kaubanduskeskuse või ümbritseva piirkonna võimalike muudatuste plaanidega?',o:['Olen plaanidega hästi kursis','Olen plaanidest kuulnud, kuid tean vähe','Ma ei ole plaanidest kuulnud','Ei ole kindel']},
15:{q:'Kui olete plaanidega kursis, kui kättesaadav ja arusaadav oli nende kohta käiv teave?',o:['Väga kättesaadav ja arusaadav','Pigem kättesaadav ja arusaadav','Ei kättesaadav ega kättesaamatu','Pigem kättesaamatu või ebaselge','Täiesti kättesaamatu või ebaselge','Ma ei ole plaanidega kursis','Raske öelda']},
16:{q:'Kuidas hindate elanike ja ettevõtjate võimalusi mõjutada selle piirkonna tulevikku puudutavaid otsuseid?',o:['Nad saavad oluliselt mõjutada','Nad saavad mõningal määral mõjutada','Nad saavad mõjutada vaid vähesel määral','Nad praktiliselt ei saa mõjutada','Ei tea']},
17:{q:'Kui olete osalenud selle piirkonna tuleviku arutelus, kui palju tundsite, et teie arvamust kuulati?',o:['Minu arvamust arvestati suurel määral','Minu arvamust arvestati osaliselt','Minu arvamust kuulati, kuid ma ei tea, kas see otsuseid mõjutas','Minu arvamust ei arvestatud','Osalesin, kuid ei oska tulemust hinnata','Ma ei ole aruteludes osalenud','Ma ei teadnud osalemisvõimalusest']},
18:{q:'Kuidas eelistaksite osaleda selle piirkonna tuleviku arutelus?',h:'Võite valida mitu varianti.',o:['Veebiküsitlused','Avatud kohtumised ja avalikud arutelud','Arutelud mitmes keeles','Elanike ja ettevõtjate töörühmad','Konsultatsioonid otse kaubanduskeskuses','Lühikesed intervjuud elanike ja külastajatega','Teave ja võimalus anda tagasisidet veebis','Ma ei soovi osaleda','Muu viis']},
19:{q:'Milline muudatuste tulemus oleks teile kõige vastuvõetavam?',o:['Kaasaegne kaubanduskeskus uute poodide ja teenustega','Mugavam avalik ruum haljasalade ja kohtumiskohtadega','Praeguste poodide ja kultuurilise mitmekesisuse säilitamine','Moderniseerimise ning kohalike ettevõtete ja piirkonna identiteedi säilitamise kombinatsioon','Praeguse olukorra säilitamine väikeste parandustega','Muu tulemus','Raske öelda']},
20:{q:'Mida peaksid teie arvates linnavõimud ja teised planeerimises osalejad selle piirkonna kohta otsuseid tehes eriti arvestama?'},

22:{q:'Millises keeles või keeltes eelistaksite saada teavet linnaplaneerimise kohta?',h:'Võite valida mitu varianti.',o:['soome','rootsi','inglise','vene','eesti','ukraina','somaali','araabia','hindi','hiina (mandariini)','pärsia (farsi)','dari','puštu','tagalogi (filipiini)','albaania','kurdi','türgi','vietnami','tai','hispaania','bengali','Muu keel']},
23:{q:'Millises keeles või keeltes räägite tavaliselt kodus?'}}};

T.uk={ui:{title:'Опитування мешканців і відвідувачів про майбутнє місцевих торговельних центрів',intro:'Опитування анонімне та добровільне. Правильних чи неправильних відповідей немає: нам важлива ваша особиста думка. Ви можете пропустити будь-яке запитання або припинити участь у будь-який момент. «Зміни» — це можливі зміни будівель, магазинів, громадських просторів, інфраструктури та функцій території; це не означає, що всі вони будуть реалізовані.',start:'Почати',next:'Далі',back:'Назад',finish:'Завершити',other:'Уточніть',max:'Не більше {n}',thanks:'Дякуємо за участь! Ваші відповіді допоможуть краще зрозуміти потреби людей, які живуть поруч із цією територією, працюють тут або регулярно її відвідують.',copy:'Скопіювати відповіді',opt:'необов’язкове запитання'},
s1:['1 — зовсім не погоджуюся','2 — скоріше не погоджуюся','3 — ні погоджуюся, ні не погоджуюся','4 — скоріше погоджуюся','5 — повністю погоджуюся','Важко відповісти'],
s2:['1 — зовсім не турбує','2 — скоріше не турбує','3 — певною мірою турбує','4 — сильно турбує','5 — дуже сильно турбує','Не очікую такого наслідку','Важко відповісти'],
q:{1:{q:'Який торговельний центр або територія вас цікавить?',o:['Торговий центр «Пухос» (Puhos), Гельсінкі','Торговий центр «Контула» (Kontula), Гельсінкі','Торговий центр «Ітіс» (Itis), Гельсінкі','Торговий центр «Молл Трипла» (Mall of Tripla), Гельсінкі','Торговий центр «Хакуніла» (Hakunila), Вантаа','Торговий центр «Мюрмянні» (Myyrmanni), Вантаа','Торговий центр «Юмбо» (Jumbo), Вантаа','Торговий центр «Ентрессе» (Entresse), Еспоо','Торговий центр «Селло» (Sello), Еспоо','Торговий центр «Ісо-Омена» (Iso Omena), Еспоо']},
2:{q:'Як часто ви відвідуєте цей торговельний центр або навколишню територію?',o:['Щодня або майже щодня','Кілька разів на тиждень','Кілька разів на місяць','Рідше ніж раз на місяць','Я тут уперше']},
3:{q:'Як ви пов’язані з цим місцем?',h:'Можна вибрати кілька варіантів.',o:['Живу поблизу','Працюю поблизу','Володію місцевим бізнесом','Працюю в місцевому магазині, кафе чи іншому підприємстві','Регулярно купую тут товари або користуюся послугами','Користуюся громадськими просторами або відвідую заходи','Навчаюся поблизу','Інше']},
4:{q:'Як довго ви живете, працюєте або регулярно буваєте в цьому районі?',o:['Менше року','Від 1 до 5 років','Понад 5 років','Я не живу і не працюю поблизу, але відвідую це місце','Важко відповісти']},
5:{q:'Наскільки ви загалом задоволені нинішнім станом торговельного центру та навколишньої території?',o:['1 — зовсім не задоволений(-а)','2 — скоріше не задоволений(-а)','3 — ні задоволений(-а), ні не задоволений(-а)','4 — скоріше задоволений(-а)','5 — повністю задоволений(-а)','Важко відповісти']},
6:{q:'Що робить це місце особливим або важливим особисто для вас?',o:['Тут є магазини й товари, які важко знайти в інших місцях','Тут можна отримати послуги або спілкуватися зручною для мене мовою','Тут представлені різні культури, кухні та традиції','Тут я зустрічаю друзів, знайомих або сусідів','Це важливе місце в моєму повсякденному житті','Тут працюють невеликі незалежні підприємства','Тут товари й послуги доступні за ціною','Мені подобаються архітектура, атмосфера або організація простору','Тут відбуваються цікаві заходи або культурні події','Для мене це місце не має особливого значення','Інше']},
7:{q:'Наскільки ви погоджуєтеся з наведеними твердженнями?',r:['Це місце важливе для повсякденного життя місцевої громади.','Культурна та мовна різноманітність є цінною якістю цього місця.','Я відчуваю зв’язок із цим місцем.','Це місце дає змогу людям із різним життєвим досвідом зустрічатися й взаємодіяти.','Під час змін території важливо враховувати потреби людей, які нею користуються зараз.']},
8:{q:'Наскільки ви підтримуєте зміни торговельного центру та навколишньої території, якщо вони спрямовані на покращення будівель, громадських просторів і місцевих послуг?',o:['Повністю підтримую','Скоріше підтримую','Ні підтримую, ні не підтримую','Скоріше не підтримую','Категорично не підтримую','Мені бракує інформації, щоб відповісти']},
9:{q:'Які зміни ви хотіли б побачити насамперед?',o:['Ремонт і покращення наявних будівель','Нові магазини, кафе та ресторани','Збереження невеликих незалежних магазинів і доступної комерційної оренди','Більше зелених зон, дерев і місць для відпочинку','Зручніші пішохідні маршрути та велосипедна інфраструктура','Безпечніший і комфортніший громадський простір','Більше місць для зустрічей, заходів і культурних подій','Нове житло поруч із торговельним центром','Покращення громадського транспорту та доступності території','Покращення доступності для людей з обмеженою мобільністю','Збереження нинішнього вигляду й атмосфери','Суттєвих змін не потрібно','Інше']},
10:{q:'Що особливо важливо зберегти під час можливих змін?',h:'Можна вибрати кілька варіантів.',o:['Нинішні магазини, кафе та ресторани','Невеликі незалежні підприємства','Доступні ціни на товари й послуги','Культурну та мовну різноманітність','Історичну архітектуру та зовнішній вигляд','Місця зустрічей і спілкування','Послуги, якими я регулярно користуюся','Робочі місця та можливості для місцевого бізнесу','Зручне розташування та транспортну доступність','Нічого з переліченого','Інше']},
11:{q:'Наскільки вас турбують наведені можливі наслідки змін?',r:['Зростання цін на товари й послуги.','Зростання орендної плати для місцевих підприємств.','Закриття звичних магазинів і ресторанів.','Скорочення кількості невеликих незалежних підприємств.','Втрата культурної та мовної різноманітності.','Втрата місць, де люди зустрічаються й спілкуються.','Недостатня участь мешканців і підприємців у прийнятті рішень.','Шум, пил і тимчасові незручності під час будівельних робіт.','Збільшення навантаження на транспорт і місцеву інфраструктуру.','Погіршення доступності території для окремих груп населення.']},
12:{q:'Уявіть, що після оновлення з’являться нові будівлі та комфортніші громадські простори, але частина нинішніх магазинів може закритися. Який підхід ви б віддали перевагу?',o:['Підтримати оновлення, навіть якщо частина нинішніх магазинів закриється','Підтримати оновлення за наявності заходів захисту чинних підприємств','Проводити оновлення поступово, намагаючись зберегти більшість нинішніх магазинів','Віддати перевагу збереженню нинішнього стану з невеликими покращеннями','Важко відповісти','Інший варіант']},
13:{q:'Які заходи слід розглянути, якщо зміни підвищать витрати місцевих підприємств або ускладнять продовження їхньої роботи?',o:['Передбачити приміщення з доступною орендою для місцевих підприємств','Запропонувати чинним підприємствам альтернативні приміщення поблизу','Проводити роботи поетапно, щоб підприємства могли продовжувати працювати','Передбачити підтримку підприємців, яким доведеться переїхати','Не вводити спеціальних заходів: підприємства мають працювати на загальних ринкових умовах','Такі заходи не потрібні','Важко відповісти','Інше']},
14:{q:'Наскільки ви знайомі з планами можливих змін цього торговельного центру чи навколишньої території?',o:['Добре знайомий(-а) з планами','Чув(-ла) про плани, але знаю мало','Не чув(-ла) про плани','Не впевнений(-а)']},
15:{q:'Якщо ви знайомі з планами, наскільки доступною й зрозумілою була інформація про них?',o:['Дуже доступною й зрозумілою','Скоріше доступною й зрозумілою','Ні доступною, ні недоступною','Скоріше недоступною або незрозумілою','Зовсім недоступною або незрозумілою','Я не знайомий(-а) з планами','Важко відповісти']},
16:{q:'Як ви оцінюєте можливості мешканців і підприємців впливати на рішення щодо майбутнього цієї території?',o:['Можуть суттєво впливати','Можуть певною мірою впливати','Можуть впливати лише незначно','Практично не можуть впливати','Не знаю']},
17:{q:'Якщо ви брали участь в обговоренні майбутнього цієї території, наскільки ви відчули, що вашу думку почули?',o:['Мою думку значною мірою враховано','Мою думку частково враховано','Мою думку вислухали, але я не знаю, чи вона вплинула на рішення','Мою думку не враховано','Я брав(-ла) участь, але не можу оцінити результат','Я не брав(-ла) участі в обговореннях','Я не знав(-ла) про можливість узяти участь']},
18:{q:'Яким чином ви хотіли б брати участь в обговоренні майбутнього цієї території?',h:'Можна вибрати кілька варіантів.',o:['Онлайн-опитування','Відкриті зустрічі та громадські обговорення','Обговорення кількома мовами','Робочі групи за участі мешканців і підприємців','Консультації безпосередньо в торговельному центрі','Короткі інтерв’ю з мешканцями та відвідувачами','Інформація та можливість залишити відгук онлайн','Я не хочу брати участь','Інший спосіб']},
19:{q:'Який результат змін був би для вас найприйнятнішим?',o:['Сучасний торговельний центр з новими магазинами та послугами','Комфортніший громадський простір із зеленими зонами та місцями зустрічей','Збереження нинішніх магазинів і культурної різноманітності','Поєднання модернізації зі збереженням місцевих підприємств та ідентичності району','Збереження нинішнього стану з невеликими покращеннями','Інший варіант','Важко відповісти']},
20:{q:'Що, на вашу думку, міській владі та іншим учасникам планування особливо важливо врахувати під час ухвалення рішень щодо цієї території?'},
21:{q:'До якої вікової групи ви належите?',o:['До 18 років','18–29 років','30–44 роки','45–59 років','60 років і старше','Не хочу відповідати']},
22:{q:'Якою мовою або мовами вам зручніше отримувати інформацію про міське планування?',h:'Можна вибрати кілька варіантів.',o:['Фінська','Шведська','Англійська','Російська','Естонська','Українська','Сомалійська','Арабська','Гінді','Китайська (мандаринська)','Перська (фарсі)','Дарі','Пушту','Тагальська (філіппінська)','Албанська','Курдська','Турецька','В’єтнамська','Тайська','Іспанська','Бенгальська','Інша мова']},

14:{q:'您对这个购物中心或周边区域可能改造的规划了解多少？',o:['非常了解这些规划','听说过这些规划，但了解不多','没有听说过这些规划','不确定']},
15:{q:'如果您了解这些规划，相关信息是否容易获取和理解？',o:['非常容易获取和理解','比较容易获取和理解','说不上容易或不容易','比较难获取或不易理解','完全无法获取或无法理解','我不了解这些规划','不确定']},

T.so={ui:{title:'Sahan dadka deggan iyo booqdayaasha ku saabsan mustaqbalka xarumaha ganacsiga ee deegaanka',intro:'Sahankani waa mid qarsoodi ah oo ikhtiyaari ah. Jawaabo sax ah ama khalad ah ma jiraan: waxaan xiisaynaynaa aragtidaada gaarka ah. Su’aal kasta waad ka boodi kartaa, waadna joojin kartaa ka qaybgalka wakhti kasta. “Isbeddelada” waxay ula jeedaan isbeddelada suurtagalka ah ee dhismayaasha, dukaamada, goobaha dadweynaha, kaabayaasha iyo shaqooyinka aagga; macnaheedu maaha in dhammaan isbeddeladaas la fulin doono.',start:'Bilow',next:'Xiga',back:'Dib',finish:'Dhammee',other:'Fadlan caddee',max:'Dooro ugu badnaan {n}',thanks:'Waad ku mahadsan tahay ka qaybgalka! Jawaabahaaga waxay naga caawin doonaan inaan si fiican u fahanno baahiyaha dadka ku nool agagaarka aaggan, halkan ka shaqeeya ama si joogto ah u booqda.',copy:'Koobi jawaabaha',opt:'su’aal ikhtiyaari ah'},

4:{q:'Intee in leeg ayaad ku nooshahay, ka shaqaysay ama si joogto ah ugu joogtay aaggan?',o:['In ka yar hal sano','1 ilaa 5 sano','In ka badan 5 sano','Ma degganey mana shaqeeyo meel u dhow, laakiin waan booqdaa goobtan','Ma aqaan']},
5:{q:'Guud ahaan, intee in leeg ayaad ku qanacsan tahay xaaladda hadda jirta ee xarunta ganacsiga iyo aagga ku xeeran?',o:['1 — gabi ahaanba ma qanacsani','2 — in badan ma qanacsani','3 — dhexdhexaad','4 — in badan waan qanacsanahay','5 — gabi ahaanba waan qanacsanahay','Ma aqaan']},
6:{q:'Maxaa goobtan kuu gaar ka dhigaya ama muhiim kuu ah shakhsi ahaan?',o:['Halkan waxaa ku jira dukaamo iyo alaab adag in meelo kale laga helo','Halkan waxaan ka heli karaa adeegyo ama waxaan kula hadli karaa luqad ila habboon','Halkan waxaa ka muuqda dhaqamo, cunno iyo caadooyin kala duwan','Halkan waxaan kula kulmaa saaxiibo, dad aan aqaan ama deriska','Waa goob muhiim u ah nolol maalmeedkayga','Halkan waxaa ka shaqeeya ganacsiyo yaryar oo madax-bannaan','Halkan alaabta iyo adeegyadu waa qiimo jaban yihiin','Waan jeclahay naqshadda dhismaha, jawiga ama habaynta goobta','Halkan waxaa ka dhaca dhacdooyin xiiso leh ama dhacdooyin dhaqan','Goobtan macno gaar ah ima siiso','Kale']},
7:{q:'Intee in leeg ayaad ku raacsan tahay odhaahda soo socota?',r:['Goobtani waxay muhiim u tahay nolol maalmeedka bulshada deegaanka.','Kala duwanaanshaha dhaqanka iyo luqadda waa astaan qiimo leh oo goobtan ah.','Waxaan dareemayaa xiriir aan la leeyahay goobtan.','Goobtani waxay u fursad siisaa dadka khibrado nololeed kala duwan leh inay kulmaan oo wada shaqeeyaan.','Marka aagga wax laga beddelayo, waxaa muhiim ah in la tixgaliyo baahiyaha dadka hadda isticmaala.']},
8:{q:'Intee in leeg ayaad taageertaa isbeddelada xarunta ganacsiga iyo aagga ku xeeran haddii loogu talagalay hagaajinta dhismayaasha, goobaha dadweynaha iyo adeegyada deegaanka?',o:['Gabi ahaanba waan taageeraa','In badan waan taageeraa','Ma taageero mana ka soo horjeedo','In badan waan ka soo horjeedaa','Gabi ahaanba waan ka soo horjeedaa','Macluumaad ku filan ma haysto si aan u jawaabo']},
9:{q:'Isbeddelada noocee ah ayaad jeclaan lahayd inaad aragto marka hore?',o:['Dayactirka iyo hagaajinta dhismayaasha jira','Dukaamo cusub, makhaayado iyo maqaayado','Ilaalinta dukaamada yaryar ee madax-bannaan iyo kirada ganacsi ee jaban','Xaafado cagaaran oo dheeraad ah, geedo iyo goobo nasasho','Waddooyin lugeed oo ka habboon iyo kaabayaasha baaskiilka','Goob dadweyne oo ka amaan badan oo ka raaxo badan','Goobo dheeraad ah oo lagu kulmo, lagu qabto dhacdooyin iyo dhaqan','Guryo cusub oo u dhow xarunta ganacsiga','Gaadiid dadweyne oo ka wanaagsan iyo helitaanka aagga','Helitaan ka wanaagsan oo loogu talagalay dadka dhaqdhaqaaqoodu xaddidan yahay','Ilaalinta muuqaalka iyo jawiga hadda jira','Isbeddello waaweyn looma baahna','Kale']},
10:{q:'Maxaa si gaar ah muhiim u ah in la ilaaliyo haddii isbeddelo dhaco?',h:'Waxaad dooran kartaa dhowr doorasho.',o:['Dukaamada, makhaayadaha iyo maqaayadaha hadda jira','Ganacsiyada yaryar ee madax-bannaan','Qiimaha jaban ee alaabta iyo adeegyada','Kala duwanaanshaha dhaqanka iyo luqadda','Naqshadda taariikhiga ah iyo muuqaalka','Goobaha lagu kulmo oo lagu wada hadlo','Adeegyada aan si joogto ah u isticmaalo','Shaqooyinka iyo fursadaha ganacsiga maxalliga ah','Meel ku habboon iyo helitaanka gaadiidka','Midkoodna','Kale']},
11:{q:'Intee in leeg ayay ku werwerinayaan saamaynta suurtagalka ah ee isbeddelada soo socda?',r:['Kor u kaca qiimaha alaabta iyo adeegyada.','Kor u kaca kirada ganacsiyada maxalliga ah.','Xidhmidda dukaamada iyo maqaayadaha la yaqaan.','Yaraanta tirada ganacsiyada yaryar ee madax-bannaan.','Luminta kala duwanaanshaha dhaqanka iyo luqadda.','Luminta goobaha dadku ku kulmaan oo ku wada hadlaan.','Ka qaybgal la’aan ku filan oo dadka deggan iyo ganacsatada ah go’aan qaadashada.','Buuq, boodh iyo dhibaato ku meel gaar ah inta lagu jiro shaqada dhismaha.','Kordhinta culeyska gaadiidka iyo kaabayaasha deegaanka.','Hoos u dhaca helitaanka aagga ee kooxaha qaarkood.']},
12:{q:'Qiyaas in kadib cusboonaysiinta ay jiri doonaan dhismayaal cusub iyo goobo dadweyne oo ka raaxo badan, laakiin qaar ka mid ah dukaamada hadda jira laga yaabo inay xidhmaan. Habka noocee ah ayaad door bidi lahayd?',o:['Taageeridda cusboonaysiinta xitaa haddii qaar ka mid ah dukaamada hadda jira ay xidhmaan','Taageeridda cusboonaysiinta haddii ay jiraan tallaabooyin lagu ilaaliyo ganacsiyada jira','Cusboonaysiin tartiib tartiib ah, iyadoo la isku dayayo in la ilaaliyo inta badan dukaamada hadda jira','Door bidida in xaaladda hadda jirta la ilaaliyo iyadoo hagaajin yar la sameeyo','Ma aqaan','Hab kale']},
13:{q:'Tallaabooyin noocee ah ayaa la tixgelin lahaa haddii isbeddeladu kordhiyaan kharashka ganacsiyada maxalliga ah ama ay ku adkeeyaan inay sii wadaan shaqada?',o:['Bixinta goobo kiro jaban leh oo loogu talagalay ganacsiyada maxalliga ah','U soo bandhigidda ganacsiyada jira goobo beddel ah oo u dhow','In shaqooyinka loo fuliyo marxalado si ganacsiyadu u sii wadaan shaqada','Bixinta taageero loogu talagalay ganacsatada ku qasbanaada inay dhaqaaqaan','Tallaabooyin gaar ah ha la qaadin: ganacsiyadu waa inay ku shaqeeyaan shuruudaha guud ee suuqa','Tallaabooyinkaas looma baahna','Ma aqaan','Kale']},
14:{q:'Intee in leeg ayaad ka war haysaa qorshayaasha isbeddelada suurtagalka ah ee xarunta ganacsiga ama aagga ku xeeran?',o:['Si fiican ayaan qorshayaasha u ogahay','Waan maqlay qorshayaasha laakiin wax yar baan ka ogahay','Ma maqlin qorshayaasha','Ma hubo']},
15:{q:'Haddii aad qorshayaasha ka war haysato, intee in leeg ayay ahayd macluumaadkoodu mid la heli karo oo la fahmi karo?',o:['Aad ayuu u sahlanaa in la helo oo la fahmo','In badan waa la heli karay oo la fahmi karay','Mid la heli karo ma ahayn mana aha mid la heli waayay','In badan lama heli karin ama ma cadda','Gabi ahaanba lama heli karin ama ma cadda','Qorshayaasha ka war ma haysto','Ma aqaan']},
16:{q:'Sidee ayaad u qiimaysaa fursadaha dadka deggan iyo ganacsatada ay ku saamayn karaan go’aannada mustaqbalka aaggan?',o:['Waxay si weyn u saamayn karaan','Waxay xad ahaan u saamayn karaan','Waxay yar u saamayn karaan','Dhab ahaan ma saamayn karaan','Ma aqaan']},
17:{q:'Haddii aad ka qaybgashay wada hadallada mustaqbalka aaggan, intee in leeg ayaad dareentay in aragtidaada la maqlay?',o:['Aragtidayda si weyn ayaa loo tixgeliyay','Aragtidayda qayb ahaan ayaa loo tixgeliyay','Aragtidayda waa la maqlay, laakiin ma aqaan in ay saamaysay go’aannada','Aragtidayda lama tixgelin','Waan ka qaybgalay, laakiin ma qiimayn karo natiijada','Ma ka qaybgalin wada hadallada','Ma ogayn fursadda ka qaybgalka']},
18:{q:'Sidee baad door bidaysaa inaad uga qaybgasho wada hadallada mustaqbalka aaggan?',h:'Waxaad dooran kartaa dhowr doorasho.',o:['Sahannada onlayn ah','Kulamo furan iyo wada hadallo dadweyne','Wada hadallo luqado badan ah','Kooxo shaqo oo ay ku jiraan dadka deggan iyo ganacsatada','La-talin toos ah oo ka dhacda xarunta ganacsiga','Wareysiyo gaagaaban oo lala yeesho dadka deggan iyo booqdayaasha','Macluumaad iyo fursad onlayn looga bixiyo jawaab celin','Ma rabo inaan ka qaybgalo','Hab kale']},
19:{q:'Natiijo noocee ah oo isbeddelada ka timaadda ayaa kuu aqbali lahayd ugu badnaan?',o:['Xarun ganacsi oo casri ah oo leh dukaamo iyo adeegyo cusub','Goob dadweyne oo ka raaxo badan oo leh xaafado cagaaran iyo goobo lagu kulmo','Ilaalinta dukaamada hadda jira iyo kala duwanaanshaha dhaqanka','Isku darka casriyeynta iyo ilaalinta ganacsiyada maxalliga ah iyo aqoonsiga aagga','Ilaalinta xaaladda hadda jirta iyadoo hagaajin yar la sameeyo','Natiijo kale','Ma aqaan']},
20:{q:'Fikradaada, maxaa si gaar ah muhiim u ah in maamulka magaalada iyo kuwa kale ee ka qayb qaata qorsheynta ay tixgeliyaan marka ay go’aamada ka gaarayaan aaggan?'},
21:{q:'Kooxda da’deed noocee ah ayaad ku jirtaa?',o:['Ka yar 18','18–29','30–44','45–59','60 iyo ka weyn','Ma rabo inaan jawaabo']},
22:{q:'Luqadda ama luqadaha noocee ah ayaad door bidaysaa inaad ku hesho macluumaadka ku saabsan qorsheynta magaalada?',h:'Waxaad dooran kartaa dhowr doorasho.',o:['Finlandees','Iswiidhish','Ingiriisi','Ruush','Estooniyaan','Yukreeniyaan','Soomaali','Carabi','Hindi','Shiinaha (Mandarin)','Faarisi (Farsi)','Dari','Bashtuu','Tagalog (Filibiin)','Albaaniyaan','Kurdi','Turki','Fiyetnaamees','Taay','Isbaanish','Bengaali','Luqad kale']},
23:{q:'Luqadda ama luqadaha noocee ah ayaad inta badan guriga ku hadashaa?'}}};

T.tl={ui:{title:'Sarbey ng mga residente at bisita tungkol sa kinabukasan ng mga lokal na shopping center',intro:'Ang sarbey na ito ay anonymous at kusang-loob. Walang tama o maling sagot: mahalaga sa amin ang inyong personal na opinyon. Maaari ninyong laktawan ang anumang tanong at itigil ang pakikilahok anumang oras. Ang “mga pagbabago” ay tumutukoy sa posibleng pagbabago sa mga gusali, tindahan, pampublikong espasyo, imprastraktura at gamit ng lugar; hindi ito nangangahulugang lahat ng nakalista ay isasakatuparan.',start:'Simulan',next:'Susunod',back:'Bumalik',finish:'Tapusin',other:'Pakitukoy',max:'Pumili ng hanggang {n}',thanks:'Salamat sa inyong pakikilahok! Makakatulong ang inyong mga sagot upang mas maunawaan ang pangangailangan ng mga taong nakatira malapit sa lugar na ito, nagtatrabaho rito o regular na dumadalaw.',copy:'Kopyahin ang mga sagot',opt:'opsyonal na tanong'},
s1:['1 — lubos na hindi sumasang-ayon','2 — medyo hindi sumasang-ayon','3 — ni sumasang-ayon ni hindi sumasang-ayon','4 — medyo sumasang-ayon','5 — lubos na sumasang-ayon','Hindi ko alam'],
s2:['1 — hindi nababahala','2 — hindi gaanong nababahala','3 — medyo nababahala','4 — lubhang nababahala','5 — labis na nababahala','Hindi ko inaasahan ang ganitong epekto','Hindi ko alam'],
q:{1:{q:'Aling shopping center o lugar ang interesado kayo?',o:['Puhos Shopping Center, Helsinki','Kontula Shopping Center, Helsinki','Itis Shopping Center, Helsinki','Mall of Tripla, Helsinki','Hakunila Shopping Center, Vantaa','Myyrmanni Shopping Center, Vantaa','Jumbo Shopping Center, Vantaa','Entresse Shopping Center, Espoo','Sello Shopping Center, Espoo','Iso Omena Shopping Center, Espoo']},
2:{q:'Gaano kayo kadalas bumisita sa shopping center na ito o sa paligid nito?',o:['Araw-araw o halos araw-araw','Ilang beses sa isang linggo','Ilang beses sa isang buwan','Mas madalang kaysa isang beses sa isang buwan','Unang beses ko ito rito']},
3:{q:'Paano kayo konektado sa lugar na ito?',h:'Maaari kayong pumili ng higit sa isa.',o:['Nakatira ako sa malapit','Nagtatrabaho ako sa malapit','May-ari ako ng lokal na negosyo','Nagtatrabaho ako sa lokal na tindahan, café o ibang negosyo','Regular akong bumibili ng mga produkto o gumagamit ng mga serbisyo rito','Gumagamit ako ng mga pampublikong espasyo o dumadalo sa mga kaganapan','Nag-aaral ako sa malapit','Iba pa']},
4:{q:'Gaano katagal na kayong nakatira, nagtatrabaho o regular na nagpupunta sa lugar na ito?',o:['Wala pang isang taon','1 hanggang 5 taon','Mahigit 5 taon','Hindi ako nakatira o nagtatrabaho sa malapit, ngunit bumibisita ako sa lugar na ito','Hindi ko alam']},
5:{q:'Sa pangkalahatan, gaano kayo kasiyahan sa kasalukuyang kalagayan ng shopping center at ng paligid nito?',o:['1 — hindi talaga nasisiyahan','2 — medyo hindi nasisiyahan','3 — hindi nasisiyahan ni nasisiyahan','4 — medyo nasisiyahan','5 — lubos na nasisiyahan','Hindi ko alam']},
6:{q:'Ano ang nagpapaespesyal o nagpapahalaga sa lugar na ito para sa inyo?',o:['May mga tindahan at produkto rito na mahirap hanapin sa ibang lugar','Dito ako makakakuha ng serbisyo o makakapag-usap sa wikang komportable sa akin','Makikita rito ang iba’t ibang kultura, lutuin at tradisyon','Dito ko nakikita ang mga kaibigan, kakilala o kapitbahay','Mahalagang lugar ito sa pang-araw-araw kong buhay','May mga maliliit na independiyenteng negosyo rito','Abot-kaya ang mga produkto at serbisyo rito','Gusto ko ang arkitektura, ambiance o pagkakaayos ng lugar','May mga kawili-wiling kaganapan o aktibidad pangkultura rito','Walang espesyal na kahulugan sa akin ang lugar na ito','Iba pa']},
7:{q:'Gaano kayo sumasang-ayon sa mga sumusunod na pahayag?',r:['Mahalaga ang lugar na ito sa pang-araw-araw na buhay ng lokal na komunidad.','Mahalagang katangian ng lugar na ito ang pagkakaiba-iba ng kultura at wika.','Nararamdaman kong konektado ako sa lugar na ito.','Binibigyang-daan ng lugar na ito ang mga taong may iba’t ibang karanasan sa buhay na magkita at makipag-ugnayan.','Kapag nagbabago ang lugar, mahalagang isaalang-alang ang pangangailangan ng mga taong gumagamit nito ngayon.']},
8:{q:'Gaano ninyo sinusuportahan ang mga pagbabago sa shopping center at sa paligid nito kung ang layunin ay pagandahin ang mga gusali, pampublikong espasyo at lokal na serbisyo?',o:['Lubos na sumusuporta','Medyo sumusuporta','Hindi sumusuporta ni tumututol','Medyo tumututol','Lubos na tumututol','Kulang ang impormasyon ko para sumagot']},
9:{q:'Anong mga pagbabago ang gusto ninyong unahin?',o:['Pagkukumpuni at pagpapabuti ng mga kasalukuyang gusali','Mga bagong tindahan, café at restawran','Pananatili ng maliliit na independiyenteng tindahan at abot-kayang upa sa komersyal na espasyo','Mas maraming berdeng lugar, puno at pahingahan','Mas maginhawang daanang panlakad at imprastraktura para sa bisikleta','Mas ligtas at mas komportableng pampublikong espasyo','Mas maraming lugar para sa pagtitipon, mga kaganapan at gawaing pangkultura','Bagong pabahay malapit sa shopping center','Mas mahusay na pampublikong transportasyon at pagpunta sa lugar','Mas mahusay na accessibility para sa mga taong may limitadong paggalaw','Pagpapanatili ng kasalukuyang hitsura at ambiance','Walang malalaking pagbabagong kailangan','Iba pa']},
10:{q:'Ano ang lalong mahalagang panatilihin kung may mga pagbabago?',h:'Maaari kayong pumili ng higit sa isa.',o:['Mga kasalukuyang tindahan, café at restawran','Maliliit na independiyenteng negosyo','Abot-kayang presyo ng mga produkto at serbisyo','Pagkakaiba-iba ng kultura at wika','Makasaysayang arkitektura at hitsura','Mga lugar ng pagtitipon at pakikisalamuha','Mga serbisyong regular kong ginagamit','Mga trabaho at oportunidad para sa lokal na negosyo','Maginhawang lokasyon at access sa transportasyon','Wala sa mga nabanggit','Iba pa']},
11:{q:'Gaano kayo nababahala sa mga sumusunod na posibleng epekto ng mga pagbabago?',r:['Pagtaas ng presyo ng mga produkto at serbisyo.','Pagtaas ng upa para sa mga lokal na negosyo.','Pagsasara ng mga pamilyar na tindahan at restawran.','Pagbaba ng bilang ng maliliit na independiyenteng negosyo.','Pagkawala ng pagkakaiba-iba ng kultura at wika.','Pagkawala ng mga lugar kung saan nagkikita at nakikipagkuwentuhan ang mga tao.','Hindi sapat na pakikilahok ng mga residente at negosyante sa paggawa ng desisyon.','Ingay, alikabok at pansamantalang abala habang may konstruksyon.','Pagtaas ng bigat sa transportasyon at lokal na imprastraktura.','Paghina ng accessibility ng lugar para sa ilang grupo ng tao.']},
12:{q:'Isipin na pagkatapos ng pagbabago ay magkakaroon ng mga bagong gusali at mas komportableng pampublikong espasyo, ngunit maaaring magsara ang ilan sa mga kasalukuyang tindahan. Aling paraan ang mas gusto ninyo?',o:['Suportahan ang pagbabago kahit magsara ang ilan sa mga kasalukuyang tindahan','Suportahan ang pagbabago kung may mga hakbang na magpoprotekta sa mga kasalukuyang negosyo','Isagawa ang pagbabago nang unti-unti, na sinusubukang panatilihin ang karamihan sa mga kasalukuyang tindahan','Mas gusto kong panatilihin ang kasalukuyang kalagayan na may kaunting pagpapabuti','Hindi ko alam','Ibang paraan']},
13:{q:'Anong mga hakbang ang dapat isaalang-alang kung tataas ng mga pagbabago ang gastos ng mga lokal na negosyo o mahihirapan silang magpatuloy?',o:['Magbigay ng mga espasyong may abot-kayang upa para sa mga lokal na negosyo','Mag-alok sa mga kasalukuyang negosyo ng alternatibong espasyo sa malapit','Isagawa ang mga gawain nang paunti-unti upang makapagpatuloy ang mga negosyo','Magbigay ng suporta sa mga negosyanteng kailangang lumipat','Walang espesyal na hakbang: dapat gumana ang mga negosyo sa pangkalahatang kondisyon ng merkado','Hindi kailangan ang ganitong mga hakbang','Hindi ko alam','Iba pa']},
14:{q:'Gaano kayo kapamilyar sa mga plano para sa posibleng pagbabago ng shopping center na ito o ng paligid nito?',o:['Lubos akong pamilyar sa mga plano','May narinig ako tungkol sa mga plano ngunit kaunti lang ang alam ko','Wala akong narinig tungkol sa mga plano','Hindi sigurado']},
15:{q:'Kung pamilyar kayo sa mga plano, gaano naging madaling makuha at maunawaan ang impormasyon tungkol dito?',o:['Napakadaling makuha at maunawaan','Medyo madaling makuha at maunawaan','Hindi madali ni mahirap makuha','Medyo mahirap makuha o hindi malinaw','Lubhang mahirap makuha o hindi malinaw','Hindi ako pamilyar sa mga plano','Hindi ko alam']},
16:{q:'Paano ninyo tinataya ang kakayahan ng mga residente at negosyante na impluwensiyahan ang mga desisyon tungkol sa kinabukasan ng lugar na ito?',o:['Malaki ang maaari nilang impluwensiya','May kaunting impluwensiya sila','Napakaliit lang ng impluwensiya nila','Halos wala silang impluwensiya','Hindi ko alam']},
17:{q:'Kung nakilahok kayo sa talakayan tungkol sa kinabukasan ng lugar na ito, gaano ninyo naramdaman na narinig ang inyong opinyon?',o:['Malaki ang naging konsiderasyon sa opinyon ko','Bahagyang isinaalang-alang ang opinyon ko','Pinakinggan ang opinyon ko, ngunit hindi ko alam kung nakaapekto ito sa mga desisyon','Hindi isinaalang-alang ang opinyon ko','Nakilahok ako, ngunit hindi ko masuri ang resulta','Hindi ako nakilahok sa mga talakayan','Hindi ko alam na may pagkakataong makilahok']},
18:{q:'Paano ninyo gustong makilahok sa talakayan tungkol sa kinabukasan ng lugar na ito?',h:'Maaari kayong pumili ng higit sa isa.',o:['Mga online na sarbey','Bukas na pulong at pampublikong talakayan','Mga talakayan sa iba’t ibang wika','Mga working group na may residente at negosyante','Mga konsultasyon mismo sa shopping center','Maikling panayam sa mga residente at bisita','Impormasyon at pagkakataong magbigay ng feedback online','Ayaw kong makilahok','Ibang paraan']},
19:{q:'Anong resulta ng mga pagbabago ang pinakatanggap-tanggap sa inyo?',o:['Modernong shopping center na may mga bagong tindahan at serbisyo','Mas komportableng pampublikong espasyo na may berdeng lugar at pagtitipunan','Pagpapanatili ng mga kasalukuyang tindahan at pagkakaiba-iba ng kultura','Kombinasyon ng modernisasyon at pagpapanatili ng mga lokal na negosyo at pagkakakilanlan ng lugar','Pagpapanatili ng kasalukuyang kalagayan na may kaunting pagpapabuti','Ibang resulta','Hindi ko alam']},
20:{q:'Sa palagay ninyo, ano ang lalong mahalagang isaalang-alang ng mga awtoridad ng lungsod at iba pang kalahok sa pagpaplano sa paggawa ng mga desisyon tungkol sa lugar na ito?'},
21:{q:'Anong pangkat ng edad kayo kabilang?',o:['Wala pang 18','18–29','30–44','45–59','60 pataas','Ayaw kong sumagot']},

s2:['1 — لا يقلقني إطلاقًا','2 — لا يقلقني كثيرًا','3 — يقلقني إلى حد ما','4 — يقلقني كثيرًا','5 — يقلقني بشدة','لا أتوقع هذه النتيجة','لا أعرف'],
q:{1:{q:'أي مركز تسوق أو منطقة تهمّك؟',o:['مركز بوهوس للتسوق (Puhos)، هلسنكي','مركز كونتولا للتسوق (Kontula)، هلسنكي','مركز إيتيس للتسوق (Itis)، هلسنكي','مول تريبلا (Mall of Tripla)، هلسنكي','مركز هاكونيلا للتسوق (Hakunila)، فانتا','مركز ميرماني للتسوق (Myyrmanni)، فانتا','مركز يومبو للتسوق (Jumbo)، فانتا','مركز إنتريسه للتسوق (Entresse)، إسبو','مركز سيلو للتسوق (Sello)، إسبو','مركز إيسو أومينا للتسوق (Iso Omena)، إسبو']},
2:{q:'كم مرة تزور مركز التسوق هذا أو المنطقة المحيطة به؟',o:['كل يوم أو تقريبًا كل يوم','عدة مرات في الأسبوع','بضع مرات في الشهر','أقل من مرة في الشهر','هذه زيارتي الأولى']},
3:{q:'ما علاقتك بهذا المكان؟',h:'يمكنك اختيار عدة خيارات.',o:['أسكن بالقرب منه','أعمل بالقرب منه','أملك مشروعًا محليًا','أعمل في متجر أو مقهى أو مشروع محلي آخر','أشتري هنا بضائع أو أستخدم خدمات بانتظام','أستخدم المساحات العامة أو أحضر الفعاليات','أدرس بالقرب منه','أخرى']},
4:{q:'منذ متى تسكن أو تعمل أو تقضي وقتًا بانتظام في هذه المنطقة؟',o:['أقل من سنة','من 1 إلى 5 سنوات','أكثر من 5 سنوات','لا أسكن ولا أعمل بالقرب منها، لكنني أزور هذا المكان','لا أعرف']},
5:{q:'بشكل عام، ما مدى رضاك عن الوضع الحالي لمركز التسوق والمنطقة المحيطة به؟',o:['1 — غير راضٍ إطلاقًا','2 — غير راضٍ إلى حد ما','3 — لست راضيًا ولا غير راضٍ','4 — راضٍ إلى حد ما','5 — راضٍ تمامًا','لا أعرف']},
6:{q:'ما الذي يجعل هذا المكان مميزًا أو مهمًا بالنسبة لك شخصيًا؟',o:['توجد هنا متاجر ومنتجات يصعب العثور عليها في أماكن أخرى','يمكنني هنا الحصول على الخدمات أو التواصل بلغة مريحة لي','تجتمع هنا ثقافات ومطابخ وتقاليد مختلفة','ألتقي هنا بأصدقاء أو معارف أو جيران','إنه مكان مهم في حياتي اليومية','تعمل هنا مشاريع صغيرة مستقلة','البضائع والخدمات هنا بأسعار معقولة','تعجبني عمارة المكان أو أجواؤه أو تصميمه','تقام هنا فعاليات مثيرة للاهتمام أو أنشطة ثقافية','ليس لهذا المكان أي أهمية خاصة بالنسبة لي','أخرى']},
7:{q:'إلى أي مدى توافق على العبارات التالية؟',r:['هذا المكان مهم للحياة اليومية للمجتمع المحلي.','التنوع الثقافي واللغوي ميزة قيّمة لهذا المكان.','أشعر بارتباط بهذا المكان.','يتيح هذا المكان للأشخاص من ذوي التجارب الحياتية المختلفة أن يلتقوا ويتفاعلوا.','عند تغيّر المنطقة، من المهم مراعاة احتياجات الأشخاص الذين يستخدمونها الآن.']},
8:{q:'إلى أي مدى تدعم التغييرات في مركز التسوق والمنطقة المحيطة به إذا كانت تهدف إلى تحسين المباني والمساحات العامة والخدمات المحلية؟',o:['أدعم بالكامل','أدعم إلى حد ما','لا أدعم ولا أعارض','أعارض إلى حد ما','أعارض بشدة','ليست لدي معلومات كافية للإجابة']},
9:{q:'ما التغييرات التي تود رؤيتها أولًا؟',o:['ترميم المباني الحالية وتحسينها','متاجر ومقاهٍ ومطاعم جديدة','الحفاظ على المتاجر الصغيرة المستقلة وعلى إيجارات تجارية معقولة','مزيد من المساحات الخضراء والأشجار وأماكن الاستراحة','مسارات مشي أكثر راحة وبنية تحتية للدراجات','مساحة عامة أكثر أمانًا وراحة','مزيد من الأماكن للقاءات والفعاليات والأنشطة الثقافية','مساكن جديدة بالقرب من مركز التسوق','نقل عام أفضل وسهولة أكبر في الوصول إلى المنطقة','تسهيلات وصول أفضل للأشخاص ذوي الحركة المحدودة','الحفاظ على المظهر والأجواء الحالية','لا حاجة إلى تغييرات كبيرة','أخرى']},
10:{q:'ما الذي يهم الحفاظ عليه بشكل خاص في حال حدوث تغييرات؟',h:'يمكنك اختيار عدة خيارات.',o:['المتاجر والمقاهي والمطاعم الحالية','المشاريع الصغيرة المستقلة','أسعار معقولة للبضائع والخدمات','التنوع الثقافي واللغوي','العمارة التاريخية والمظهر','أماكن اللقاء والتواصل الاجتماعي','الخدمات التي أستخدمها بانتظام','فرص العمل وفرص المشاريع المحلية','الموقع المريح وسهولة المواصلات','لا شيء مما سبق','أخرى']},
11:{q:'ما مدى قلقك من النتائج المحتملة التالية للتغييرات؟',r:['ارتفاع أسعار البضائع والخدمات.','ارتفاع الإيجارات على المشاريع المحلية.','إغلاق المتاجر والمطاعم المألوفة.','انخفاض عدد المشاريع الصغيرة المستقلة.','فقدان التنوع الثقافي واللغوي.','فقدان الأماكن التي يلتقي فيها الناس ويتواصلون.','عدم كفاية مشاركة السكان وأصحاب المشاريع في اتخاذ القرار.','الضوضاء والغبار والإزعاج المؤقت أثناء أعمال البناء.','زيادة الضغط على المواصلات والبنية التحتية المحلية.','تراجع إمكانية الوصول إلى المنطقة لبعض الفئات.']},
12:{q:'تخيّل أنه بعد التجديد ستظهر مبانٍ جديدة ومساحات عامة أكثر راحة، لكن بعض المتاجر الحالية قد تُغلق. ما النهج الذي تفضله؟',o:['دعم التجديد حتى لو أُغلق بعض المتاجر الحالية','دعم التجديد إذا وُجدت إجراءات لحماية المشاريع القائمة','تجديد المنطقة تدريجيًا مع محاولة الإبقاء على معظم المتاجر الحالية','تفضيل الإبقاء على الوضع الحالي مع تحسينات بسيطة','لا أعرف','نهج آخر']},
13:{q:'ما الإجراءات التي ينبغي النظر فيها إذا رفعت التغييرات تكاليف المشاريع المحلية أو صعّبت عليها مواصلة العمل؟',o:['توفير أماكن بإيجار معقول للمشاريع المحلية','عرض أماكن بديلة قريبة على المشاريع القائمة','تنفيذ الأعمال على مراحل حتى تتمكن المشاريع من مواصلة عملها','تقديم الدعم لأصحاب المشاريع الذين يضطرون إلى الانتقال','لا إجراءات خاصة: يجب أن تعمل المشاريع وفق شروط السوق العامة','هذه الإجراءات غير مطلوبة','لا أعرف','أخرى']},
14:{q:'ما مدى اطلاعك على الخطط المتعلقة بالتغييرات المحتملة في مركز التسوق هذا أو المنطقة المحيطة به؟',o:['أنا مطّلع جيدًا على الخطط','سمعت عن الخطط لكنني أعرف القليل','لم أسمع عن الخطط','لست متأكدًا']},
15:{q:'إذا كنت مطّلعًا على الخطط، فما مدى توفر المعلومات عنها ووضوحها؟',o:['متاحة وواضحة جدًا','متاحة وواضحة إلى حد ما','لا متاحة ولا غير متاحة','صعبة المنال أو غير واضحة إلى حد ما','غير متاحة أو غير واضحة تمامًا','لست مطّلعًا على الخطط','لا أعرف']},
16:{q:'كيف تقيّم فرص السكان وأصحاب المشاريع في التأثير على القرارات المتعلقة بمستقبل هذه المنطقة؟',o:['يمكنهم التأثير بشكل كبير','يمكنهم التأثير إلى حد ما','يمكنهم التأثير بشكل طفيف فقط','لا يستطيعون التأثير عمليًا','لا أعرف']},
17:{q:'إذا شاركت في نقاشات حول مستقبل هذه المنطقة، فإلى أي مدى شعرت بأن رأيك قد سُمع؟',o:['أُخذ رأيي في الاعتبار إلى حد كبير','أُخذ رأيي في الاعتبار جزئيًا','سُمع رأيي، لكنني لا أعرف إن كان قد أثّر في القرارات','لم يُؤخذ رأيي في الاعتبار','شاركت، لكن لا أستطيع تقييم النتيجة','لم أشارك في النقاشات','لم أكن أعلم بفرصة المشاركة']},
18:{q:'كيف تفضل المشاركة في النقاش حول مستقبل هذه المنطقة؟',h:'يمكنك اختيار عدة خيارات.',o:['استطلاعات عبر الإنترنت','لقاءات مفتوحة ونقاشات عامة','نقاشات بعدة لغات','مجموعات عمل تضم السكان وأصحاب المشاريع','مشاورات مباشرة في مركز التسوق','مقابلات قصيرة مع السكان والزوار','معلومات وإمكانية تقديم الملاحظات عبر الإنترنت','لا أرغب في المشاركة','طريقة أخرى']},
19:{q:'ما النتيجة المرجوة من التغييرات التي ستكون الأكثر قبولًا لديك؟',o:['مركز تسوق حديث بمتاجر وخدمات جديدة','مساحة عامة أكثر راحة مع مساحات خضراء وأماكن للقاء','الحفاظ على المتاجر الحالية وعلى التنوع الثقافي','الجمع بين التحديث والحفاظ على المشاريع المحلية وهوية المنطقة','الإبقاء على الوضع الحالي مع تحسينات بسيطة','نتيجة أخرى','لا أعرف']},
20:{q:'برأيك، ما الذي يهم بشكل خاص أن تأخذه سلطات المدينة وسائر المشاركين في التخطيط بعين الاعتبار عند اتخاذ القرارات بشأن هذه المنطقة؟'},

22:{q:'بأي لغة أو لغات تفضل تلقي المعلومات حول التخطيط الحضري؟',h:'يمكنك اختيار عدة خيارات.',o:['الفنلندية','السويدية','الإنجليزية','الروسية','الإستونية','الأوكرانية','الصومالية','العربية','الهندية','الصينية (الماندرين)','الفارسية','الدرية','البشتو','التاغالوغية (الفلبينية)','الألبانية','الكردية','التركية','الفيتنامية','التايلاندية','الإسبانية','البنغالية','لغة أخرى']},

T.hi={ui:{title:'स्थानीय शॉपिंग सेंटरों के भविष्य पर निवासियों और आगंतुकों का सर्वेक्षण',intro:'यह सर्वेक्षण गुमनाम और स्वैच्छिक है। कोई उत्तर सही या गलत नहीं है: हमें आपकी निजी राय जानने में रुचि है। आप किसी भी प्रश्न को छोड़ सकते हैं और किसी भी समय रुक सकते हैं। “बदलाव” का अर्थ इमारतों, दुकानों, सार्वजनिक स्थानों, बुनियादी ढांचे और क्षेत्र के कार्यों में संभावित बदलाव है। इसका यह अर्थ नहीं है कि सूचीबद्ध सभी बदलाव लागू किए जाएंगे।',start:'शुरू करें',next:'आगे',back:'पीछे',finish:'समाप्त करें',other:'कृपया बताएं',max:'अधिकतम {n} चुनें',thanks:'भाग लेने के लिए धन्यवाद! आपके उत्तर हमें उन लोगों की ज़रूरतों को बेहतर समझने में मदद करेंगे जो इस क्षेत्र के पास रहते हैं, यहाँ काम करते हैं या नियमित रूप से यहाँ आते हैं।',copy:'उत्तर कॉपी करें',opt:'वैकल्पिक प्रश्न'},
s1:['1 — बिल्कुल असहमत','2 — कुछ हद तक असहमत','3 — न सहमत, न असहमत','4 — कुछ हद तक सहमत','5 — पूरी तरह सहमत','पता नहीं'],
s2:['1 — बिल्कुल चिंता नहीं','2 — ज़्यादा चिंता नहीं','3 — कुछ हद तक चिंतित','4 — काफ़ी चिंतित','5 — बहुत अधिक चिंतित','मुझे ऐसे परिणाम की उम्मीद नहीं','पता नहीं'],
q:{1:{q:'आपकी रुचि किस शॉपिंग सेंटर या क्षेत्र में है?',o:['पुहोस शॉपिंग सेंटर (Puhos), हेलसिंकी','कोंतुला शॉपिंग सेंटर (Kontula), हेलसिंकी','इतिस शॉपिंग सेंटर (Itis), हेलसिंकी','मॉल ऑफ़ ट्रिप्ला (Mall of Tripla), हेलसिंकी','हाकुनिला शॉपिंग सेंटर (Hakunila), वान्ता','म्युरमान्नी शॉपिंग सेंटर (Myyrmanni), वान्ता','जंबो शॉपिंग सेंटर (Jumbo), वान्ता','एंट्रेसे शॉपिंग सेंटर (Entresse), एस्पू','सेल्लो शॉपिंग सेंटर (Sello), एस्पू','इसो ओमेना शॉपिंग सेंटर (Iso Omena), एस्पू']},
2:{q:'आप इस शॉपिंग सेंटर या इसके आसपास के क्षेत्र में कितनी बार जाते हैं?',o:['हर दिन या लगभग हर दिन','सप्ताह में कई बार','महीने में कुछ बार','महीने में एक बार से कम','मैं यहाँ पहली बार आया/आई हूँ']},
3:{q:'इस स्थान से आपका क्या संबंध है?',h:'आप कई विकल्प चुन सकते हैं।',o:['मैं पास में रहता/रहती हूँ','मैं पास में काम करता/करती हूँ','मैं स्थानीय व्यवसाय का मालिक हूँ','मैं स्थानीय दुकान, कैफ़े या अन्य व्यवसाय में काम करता/करती हूँ','मैं यहाँ नियमित रूप से सामान खरीदता/खरीदती हूँ या सेवाओं का उपयोग करता/करती हूँ','मैं सार्वजनिक स्थानों का उपयोग करता/करती हूँ या कार्यक्रमों में भाग लेता/लेती हूँ','मैं पास में पढ़ाई करता/करती हूँ','अन्य']},
4:{q:'आप इस क्षेत्र में कितने समय से रह रहे हैं, काम कर रहे हैं या नियमित रूप से समय बिता रहे हैं?',o:['एक वर्ष से कम','1 से 5 वर्ष','5 वर्ष से अधिक','मैं पास में न रहता/रहती हूँ, न काम करता/करती हूँ, लेकिन इस स्थान पर आता/आती हूँ','पता नहीं']},
5:{q:'कुल मिलाकर, आप शॉपिंग सेंटर और उसके आसपास के क्षेत्र की वर्तमान स्थिति से कितने संतुष्ट हैं?',o:['1 — बिल्कुल संतुष्ट नहीं','2 — कुछ हद तक असंतुष्ट','3 — न संतुष्ट, न असंतुष्ट','4 — कुछ हद तक संतुष्ट','5 — पूरी तरह संतुष्ट','पता नहीं']},
6:{q:'आपके लिए यह स्थान व्यक्तिगत रूप से क्या खास या महत्वपूर्ण बनाता है?',o:['यहाँ ऐसी दुकानें और उत्पाद हैं जो अन्यत्र मिलना कठिन हैं','यहाँ मैं अपनी सुविधा की भाषा में सेवाएँ ले सकता/सकती हूँ या बातचीत कर सकता/सकती हूँ','यहाँ विभिन्न संस्कृतियाँ, व्यंजन और परंपराएँ एक साथ दिखती हैं','यहाँ मैं मित्रों, परिचितों या पड़ोसियों से मिलता/मिलती हूँ','यह मेरे दैनिक जीवन का महत्वपूर्ण स्थान है','यहाँ छोटे स्वतंत्र व्यवसाय चलते हैं','यहाँ सामान और सेवाएँ किफ़ायती हैं','मुझे यहाँ की वास्तुकला, माहौल या बनावट पसंद है','यहाँ रोचक कार्यक्रम या सांस्कृतिक गतिविधियाँ होती हैं','मेरे लिए इस स्थान का कोई विशेष महत्व नहीं है','अन्य']},
7:{q:'आप निम्नलिखित कथनों से कितने सहमत हैं?',r:['यह स्थान स्थानीय समुदाय के दैनिक जीवन के लिए महत्वपूर्ण है।','सांस्कृतिक और भाषाई विविधता इस स्थान की एक मूल्यवान विशेषता है।','मैं इस स्थान से जुड़ाव महसूस करता/करती हूँ।','यह स्थान विभिन्न जीवन अनुभव वाले लोगों को मिलने और आपस में बातचीत करने का अवसर देता है।','क्षेत्र में बदलाव होते समय, उसका अभी उपयोग करने वाले लोगों की आवश्यकताओं का ध्यान रखना महत्वपूर्ण है।']},
8:{q:'यदि शॉपिंग सेंटर और उसके आसपास के क्षेत्र में बदलावों का उद्देश्य इमारतों, सार्वजनिक स्थानों और स्थानीय सेवाओं को बेहतर बनाना हो, तो आप उनका कितना समर्थन करते हैं?',o:['पूरी तरह समर्थन करता/करती हूँ','कुछ हद तक समर्थन करता/करती हूँ','न समर्थन करता/करती हूँ, न विरोध','कुछ हद तक विरोध करता/करती हूँ','कड़ा विरोध करता/करती हूँ','उत्तर देने के लिए मेरे पास पर्याप्त जानकारी नहीं है']},
9:{q:'आप सबसे पहले कौन से बदलाव देखना चाहेंगे?',o:['मौजूदा इमारतों की मरम्मत और सुधार','नई दुकानें, कैफ़े और रेस्तरां','छोटी स्वतंत्र दुकानों और किफ़ायती व्यावसायिक किराये को बनाए रखना','अधिक हरे क्षेत्र, पेड़ और आराम करने के स्थान','अधिक सुविधाजनक पैदल मार्ग और साइकिल का बुनियादी ढांचा','अधिक सुरक्षित और आरामदायक सार्वजनिक स्थान','मिलने-जुलने, कार्यक्रमों और सांस्कृतिक गतिविधियों के लिए अधिक स्थान','शॉपिंग सेंटर के पास नए आवास','बेहतर सार्वजनिक परिवहन और क्षेत्र तक आसान पहुँच','सीमित गतिशीलता वाले लोगों के लिए बेहतर पहुँच-सुविधा','वर्तमान रूप और माहौल को बनाए रखना','किसी बड़े बदलाव की आवश्यकता नहीं है','अन्य']},
10:{q:'किसी भी बदलाव की स्थिति में विशेष रूप से क्या बनाए रखना महत्वपूर्ण है?',h:'आप कई विकल्प चुन सकते हैं।',o:['मौजूदा दुकानें, कैफ़े और रेस्तरां','छोटे स्वतंत्र व्यवसाय','सामान और सेवाओं की किफ़ायती कीमतें','सांस्कृतिक और भाषाई विविधता','ऐतिहासिक वास्तुकला और रूप-रंग','मिलने और मेल-जोल के स्थान','वे सेवाएँ जिनका मैं नियमित रूप से उपयोग करता/करती हूँ','रोज़गार और स्थानीय व्यवसाय के अवसर','सुविधाजनक स्थान और परिवहन की पहुँच','उपरोक्त में से कोई नहीं','अन्य']},
11:{q:'बदलावों के निम्नलिखित संभावित परिणाम आपको कितना चिंतित करते हैं?',r:['सामान और सेवाओं की कीमतों में वृद्धि।','स्थानीय व्यवसायों के किराये में वृद्धि।','परिचित दुकानों और रेस्तरां का बंद होना।','छोटे स्वतंत्र व्यवसायों की संख्या में कमी।','सांस्कृतिक और भाषाई विविधता का नुकसान।','लोगों के मिलने-जुलने के स्थानों का नुकसान।','निर्णय लेने में निवासियों और उद्यमियों की अपर्याप्त भागीदारी।','निर्माण कार्य के दौरान शोर, धूल और अस्थायी असुविधा।','परिवहन और स्थानीय बुनियादी ढांचे पर बढ़ता दबाव।','कुछ समूहों के लिए क्षेत्र तक पहुँच का कठिन होना।']},
12:{q:'कल्पना कीजिए कि नवीनीकरण के बाद नई इमारतें और अधिक आरामदायक सार्वजनिक स्थान बनेंगे, लेकिन कुछ मौजूदा दुकानें बंद हो सकती हैं। आप कौन-सा तरीका पसंद करेंगे?',o:['नवीनीकरण का समर्थन करूँगा/करूँगी, भले ही कुछ मौजूदा दुकानें बंद हो जाएँ','यदि मौजूदा व्यवसायों की सुरक्षा के उपाय हों, तो नवीनीकरण का समर्थन करूँगा/करूँगी','क्षेत्र का नवीनीकरण धीरे-धीरे करूँगा/करूँगी और अधिकांश मौजूदा दुकानों को बनाए रखने का प्रयास करूँगा/करूँगी','छोटे सुधारों के साथ वर्तमान स्थिति बनाए रखना पसंद करूँगा/करूँगी','पता नहीं','अन्य तरीका']},
13:{q:'यदि बदलावों से स्थानीय व्यवसायों की लागत बढ़ती है या उनके लिए काम जारी रखना कठिन हो जाता है, तो कौन-से उपाय विचार में लिए जाने चाहिए?',o:['स्थानीय व्यवसायों को किफ़ायती किराये पर जगह उपलब्ध कराना','मौजूदा व्यवसायों को पास में वैकल्पिक जगह देना','काम चरणों में करना ताकि व्यवसाय अपना कार्य जारी रख सकें','जिन उद्यमियों को स्थान बदलना पड़े, उन्हें सहायता देना','कोई विशेष उपाय नहीं: व्यवसायों को सामान्य बाज़ार शर्तों पर काम करना चाहिए','ऐसे उपायों की आवश्यकता नहीं है','पता नहीं','अन्य']},
14:{q:'आप इस शॉपिंग सेंटर या उसके आसपास के क्षेत्र में संभावित बदलावों की योजनाओं से कितने परिचित हैं?',o:['मैं योजनाओं से भली-भाँति परिचित हूँ','मैंने योजनाओं के बारे में सुना है, लेकिन बहुत कम जानता/जानती हूँ','मैंने योजनाओं के बारे में नहीं सुना','निश्चित नहीं']},
15:{q:'यदि आप योजनाओं से परिचित हैं, तो उनके बारे में जानकारी कितनी सुलभ और समझने योग्य थी?',o:['बहुत सुलभ और समझने योग्य','काफ़ी हद तक सुलभ और समझने योग्य','न सुलभ, न दुर्गम','कुछ हद तक दुर्गम या अस्पष्ट','पूरी तरह दुर्गम या अस्पष्ट','मैं योजनाओं से परिचित नहीं हूँ','पता नहीं']},
16:{q:'इस क्षेत्र के भविष्य से जुड़े निर्णयों को प्रभावित करने की निवासियों और उद्यमियों की संभावनाओं को आप कैसे आँकते हैं?',o:['वे निर्णयों को काफ़ी प्रभावित कर सकते हैं','वे कुछ हद तक प्रभावित कर सकते हैं','वे केवल थोड़ा प्रभावित कर सकते हैं','वे व्यवहार में प्रभावित नहीं कर सकते','पता नहीं']},
17:{q:'यदि आपने इस क्षेत्र के भविष्य पर चर्चा में भाग लिया है, तो आपको कितना लगा कि आपकी राय सुनी गई?',o:['मेरी राय को काफ़ी हद तक ध्यान में रखा गया','मेरी राय को आंशिक रूप से ध्यान में रखा गया','मेरी राय सुनी गई, लेकिन मुझे नहीं पता कि उसका निर्णयों पर असर पड़ा या नहीं','मेरी राय को ध्यान में नहीं रखा गया','मैंने भाग लिया, लेकिन परिणाम का आकलन नहीं कर सकता/सकती','मैंने चर्चाओं में भाग नहीं लिया','मुझे भाग लेने के अवसर की जानकारी नहीं थी']},
18:{q:'आप इस क्षेत्र के भविष्य पर चर्चा में किस तरह भाग लेना पसंद करेंगे?',h:'आप कई विकल्प चुन सकते हैं।',o:['ऑनलाइन सर्वेक्षण','खुली बैठकें और सार्वजनिक चर्चाएँ','कई भाषाओं में चर्चाएँ','निवासियों और उद्यमियों के कार्य समूह','सीधे शॉपिंग सेंटर में परामर्श','निवासियों और आगंतुकों के साथ संक्षिप्त साक्षात्कार','जानकारी और ऑनलाइन प्रतिक्रिया देने का अवसर','मैं भाग नहीं लेना चाहता/चाहती','अन्य तरीका']},
19:{q:'बदलावों का कौन-सा परिणाम आपके लिए सबसे स्वीकार्य होगा?',o:['नई दुकानों और सेवाओं वाला आधुनिक शॉपिंग सेंटर','हरे क्षेत्रों और मिलने के स्थानों के साथ अधिक आरामदायक सार्वजनिक स्थान','मौजूदा दुकानों और सांस्कृतिक विविधता को बनाए रखना','आधुनिकीकरण के साथ स्थानीय व्यवसायों और क्षेत्र की पहचान को बनाए रखना','छोटे सुधारों के साथ वर्तमान स्थिति बनाए रखना','अन्य परिणाम','पता नहीं']},
20:{q:'आपकी राय में, इस क्षेत्र के बारे में निर्णय लेते समय नगर प्रशासन और योजना में शामिल अन्य पक्षों के लिए विशेष रूप से क्या ध्यान में रखना महत्वपूर्ण है?'},
21:{q:'आप किस आयु वर्ग में आते हैं?',o:['18 से कम','18–29','30–44','45–59','60 या अधिक','उत्तर नहीं देना चाहता/चाहती']},
22:{q:'आप शहरी नियोजन के बारे में जानकारी किस भाषा या भाषाओं में प्राप्त करना पसंद करेंगे?',h:'आप कई विकल्प चुन सकते हैं।',o:['फ़िनिश','स्वीडिश','अंग्रेज़ी','रूसी','एस्टोनियाई','यूक्रेनी','सोमाली','अरबी','हिंदी','चीनी (मंदारिन)','फ़ारसी','दरी','पश्तो','तागालोग (फ़िलिपीनो)','अल्बानियाई','कुर्दी','तुर्की','वियतनामी','थाई','स्पेनिश','बंगाली','अन्य भाषा']},
23:{q:'आप घर पर आमतौर पर कौन-सी भाषा या भाषाएँ बोलते हैं?'}}};

T.fa={ui:{title:'نظرسنجی از ساکنان و بازدیدکنندگان درباره آینده مراکز خرید محلی',intro:'این نظرسنجی ناشناس و داوطلبانه است. هیچ پاسخی درست یا غلط نیست: ما به نظر شخصی شما علاقه‌مندیم. می‌توانید از هر پرسشی بگذرید و در هر زمان متوقف شوید. «تغییرات» به تغییرات احتمالی در ساختمان‌ها، فروشگاه‌ها، فضاهای عمومی، زیرساخت‌ها و کارکردهای منطقه اشاره دارد. این به آن معنا نیست که همه تغییرات فهرست‌شده اجرا خواهند شد.',start:'شروع',next:'بعدی',back:'قبلی',finish:'پایان',other:'لطفاً توضیح دهید',max:'حداکثر {n} مورد انتخاب کنید',thanks:'از مشارکت شما سپاسگزاریم! پاسخ‌های شما به ما کمک می‌کند نیازهای افرادی را که نزدیک این منطقه زندگی می‌کنند، در آن کار می‌کنند یا مرتب به آن سر می‌زنند بهتر بشناسیم.',copy:'کپی پاسخ‌ها',opt:'پرسش اختیاری'},
s1:['۱ — کاملاً مخالفم','۲ — تا حدی مخالفم','۳ — نه موافقم نه مخالف','۴ — تا حدی موافقم','۵ — کاملاً موافقم','نمی‌دانم'],

7:{q:'تا چه اندازه با گزاره‌های زیر موافقید؟',r:['این مکان برای زندگی روزمره جامعه محلی مهم است.','تنوع فرهنگی و زبانی ویژگی ارزشمند این مکان است.','با این مکان احساس پیوند می‌کنم.','این مکان به افرادی با تجربه‌های زندگی متفاوت امکان می‌دهد یکدیگر را ببینند و با هم ارتباط برقرار کنند.','هنگام تغییر منطقه، مهم است که نیازهای کسانی که اکنون از آن استفاده می‌کنند در نظر گرفته شود.']},
