9:{q:'می‌خواهید ابتدا چه تغییراتی را ببینید؟',o:['بازسازی و بهبود ساختمان‌های موجود','دکان‌ها، کافه‌ها و رستورانت‌های جدید','حفظ دکان‌های کوچک مستقل و اجاره‌های تجاری مقرون‌به‌صرفه','فضای سبز، درخت و مکان‌های استراحت بیشتر','مسیرهای پیاده‌روی راحت‌تر و زیرساخت دوچرخه‌سواری','فضای عمومی امن‌تر و راحت‌تر','مکان‌های بیشتر برای دیدارها، رویدادها و فعالیت‌های فرهنگی','مسکن جدید نزدیک مرکز خرید','حمل‌ونقل عمومی بهتر و دسترسی آسان‌تر به منطقه','دسترسی بهتر برای افراد با تحرک محدود','حفظ ظاهر و فضای فعلی','تغییرات عمده لازم نیست','سایر']},
10:{q:'در صورت وقوع تغییرات، حفظ چه چیزهایی اهمیت ویژه دارد؟',h:'می‌توانید چند گزینه انتخاب کنید.',o:['دکان‌ها، کافه‌ها و رستورانت‌های موجود','کسب‌وکارهای کوچک مستقل','قیمت‌های مناسب کالاها و خدمات','تنوع فرهنگی و زبانی','معماری و ظاهر تاریخی','مکان‌های دیدار و معاشرت','خدماتی که مرتب از آن‌ها استفاده می‌کنم','فرصت‌های شغلی و امکان فعالیت کسب‌وکارهای محلی','موقعیت مناسب و دسترسی به حمل‌ونقل','هیچ‌کدام از موارد بالا','سایر']},
11:{q:'از پیامدهای احتمالی زیر که ممکن است تغییرات به همراه داشته باشند چقدر نگرانید؟',r:['افزایش قیمت کالاها و خدمات.','افزایش اجاره‌بها برای کسب‌وکارهای محلی.','تعطیل شدن دکان‌ها و رستورانت‌های آشنا.','کاهش تعداد کسب‌وکارهای کوچک مستقل.','از دست رفتن تنوع فرهنگی و زبانی.','از دست رفتن مکان‌هایی که مردم در آن‌ها یکدیگر را می‌بینند و معاشرت می‌کنند.','مشارکت ناکافی باشندگان و کارآفرینان در تصمیم‌گیری.','سروصدا، گردوغبار و مزاحمت‌های موقت در زمان کار ساختمانی.','افزایش فشار بر حمل‌ونقل و زیرساخت‌های محلی.','دشوارتر شدن دسترسی به منطقه برای برخی گروه‌ها.']},
12:{q:'تصور کنید پس از نوسازی، ساختمان‌های جدید و فضاهای عمومی راحت‌تری ایجاد می‌شود، اما ممکن است برخی دکان‌های فعلی تعطیل شوند. کدام رویکرد را ترجیح می‌دهید؟',o:['از نوسازی حمایت می‌کنم، حتی اگر برخی دکان‌های فعلی تعطیل شوند','اگر برای محافظت از کسب‌وکارهای موجود تدابیری باشد، از نوسازی حمایت می‌کنم','منطقه را به‌تدریج نوسازی می‌کنم و می‌کوشم بیشتر دکان‌های فعلی را حفظ کنم','حفظ وضعیت فعلی همراه با بهبودهای کوچک را ترجیح می‌دهم','نمی‌دانم','رویکرد دیگر']},

14:{q:'تا چه اندازه با برنامه‌های تغییرات احتمالی این مرکز خرید یا منطقه اطراف آن آشنایید؟',o:['با برنامه‌ها به‌خوبی آشنا هستم','درباره برنامه‌ها شنیده‌ام اما اطلاع کمی دارم','درباره برنامه‌ها چیزی نشنیده‌ام','مطمئن نیستم']},
15:{q:'اگر با برنامه‌ها آشنایید، اطلاعات مربوط به آن‌ها تا چه اندازه در دسترس و قابل‌فهم بود؟',o:['بسیار در دسترس و قابل‌فهم','تا حدی در دسترس و قابل‌فهم','نه در دسترس نه غیرقابل‌دسترس','تا حدی دشوار یا نامشخص','کاملاً غیرقابل‌دسترس یا نامشخص','با برنامه‌ها آشنا نیستم','نمی‌دانم']},

18:{q:'می‌خواهید چگونه در گفتگو درباره آینده این منطقه مشارکت کنید؟',h:'می‌توانید چند گزینه انتخاب کنید.',o:['نظرسنجی‌های آنلاین','نشست‌های باز و گفتگوهای عمومی','گفتگو به چند زبان','گروه‌های کاری متشکل از باشندگان و کارآفرینان','مشاوره مستقیم در مرکز خرید','مصاحبه‌های کوتاه با باشندگان و بازدیدکنندگان','اطلاعات و امکان ارائه بازخورد آنلاین','نمی‌خواهم مشارکت کنم','روش دیگر']},

T.sq={ui:{title:'Anketë për banorët dhe vizitorët mbi të ardhmen e qendrave tregtare lokale',intro:'Kjo anketë është anonime dhe vullnetare. Nuk ka përgjigje të sakta apo të gabuara: na intereson mendimi juaj personal. Mund të kaloni çdo pyetje dhe të ndaloni në çdo kohë. «Ndryshime» nënkupton ndryshimet e mundshme në ndërtesa, dyqane, hapësira publike, infrastrukturë dhe funksione të zonës. Kjo nuk do të thotë se të gjitha ndryshimet e përmendura do të zbatohen.',start:'Fillo',next:'Tjetra',back:'Kthehu',finish:'Përfundo',other:'Specifikoni',max:'Zgjidhni më së shumti {n}',thanks:'Faleminderit për pjesëmarrjen! Përgjigjet tuaja do të na ndihmojnë të kuptojmë më mirë nevojat e njerëzve që jetojnë pranë kësaj zone, punojnë aty ose e vizitojnë rregullisht.',copy:'Kopjo përgjigjet',opt:'pyetje opsionale'},

6:{q:'Çfarë e bën këtë vend të veçantë ose të rëndësishëm për ju personalisht?',o:['Këtu ka dyqane dhe produkte që janë të vështira për t’u gjetur diku tjetër','Këtu mund të marr shërbime ose të komunikoj në një gjuhë që më përshtatet','Këtu shihen kultura, kuzhina dhe tradita të ndryshme','Këtu takoj miq, të njohur ose fqinjë','Është një vend i rëndësishëm në jetën time të përditshme','Këtu veprojnë biznese të vogla të pavarura','Mallrat dhe shërbimet këtu janë të përballueshme','Më pëlqen arkitektura, atmosfera ose organizimi i hapësirës','Këtu organizohen ngjarje ose aktivitete kulturore interesante','Ky vend nuk ka rëndësi të veçantë për mua','Tjetër']},
7:{q:'Sa jeni dakord me pohimet e mëposhtme?',r:['Ky vend është i rëndësishëm për jetën e përditshme të komunitetit lokal.','Diversiteti kulturor dhe gjuhësor është një cilësi e çmuar e këtij vendi.','Ndiej një lidhje me këtë vend.','Ky vend u mundëson njerëzve me përvoja jetësore të ndryshme të takohen dhe të bashkëveprojnë.','Kur zona ndryshon, është e rëndësishme të merren parasysh nevojat e njerëzve që e përdorin tani.']},
8:{q:'Sa i mbështesni ndryshimet në qendrën tregtare dhe zonën përreth nëse synojnë përmirësimin e ndërtesave, hapësirave publike dhe shërbimeve lokale?',o:['I mbështes plotësisht','I mbështes pjesërisht','As i mbështes, as i kundërshtoj','I kundërshtoj pjesërisht','I kundërshtoj fuqimisht','Nuk kam informacion të mjaftueshëm për të përgjigjur']},
9:{q:'Çfarë ndryshimesh do të dëshironit t’i shihnit së pari?',o:['Rinovimi dhe përmirësimi i ndërtesave ekzistuese','Dyqane, kafene dhe restorante të reja','Ruajtja e dyqaneve të vogla të pavarura dhe e qirave tregtare të përballueshme','Më shumë hapësira të gjelbra, pemë dhe vende pushimi','Rrugë më të rehatshme për këmbësorë dhe infrastrukturë për biçikleta','Hapësirë publike më e sigurt dhe më e këndshme','Më shumë vende për takime, ngjarje dhe aktivitete kulturore','Banesa të reja pranë qendrës tregtare','Transport publik më i mirë dhe qasje më e lehtë në zonë','Qasshmëri më e mirë për personat me lëvizshmëri të kufizuar','Ruajtja e pamjes dhe atmosferës aktuale','Nuk nevojiten ndryshime të mëdha','Tjetër']},
10:{q:'Çfarë është veçanërisht e rëndësishme të ruhet në rast ndryshimesh?',h:'Mund të zgjidhni disa opsione.',o:['Dyqanet, kafenetë dhe restorantet ekzistuese','Bizneset e vogla të pavarura','Çmimet e përballueshme për mallra dhe shërbime','Diversiteti kulturor dhe gjuhësor','Arkitektura dhe pamja historike','Vendet e takimit dhe të shoqërimit','Shërbimet që i përdor rregullisht','Vendet e punës dhe mundësitë për biznese lokale','Vendndodhja e volitshme dhe qasja në transport','Asnjë nga sa më sipër','Tjetër']},

12:{q:'Imagjinoni që pas rinovimit do të ndërtohen ndërtesa të reja dhe hapësira publike më të këndshme, por disa nga dyqanet ekzistuese mund të mbyllen. Cilin qasje do ta zgjidhnit?',o:['Do ta mbështesja rinovimin, edhe nëse disa dyqane ekzistuese do të mbylleshin','Do ta mbështesja rinovimin nëse ka masa për mbrojtjen e bizneseve ekzistuese','Do ta rinovoja zonën gradualisht, duke u përpjekur të ruaj shumicën e dyqaneve ekzistuese','Do të preferoja ta ruaja gjendjen aktuale me përmirësime të vogla','Nuk e di','Qasje tjetër']},

T.ckb={ui:{title:'ڕاپرسی دانیشتووان و سەردانکەران دەربارەی داهاتووی ناوەندە بازاڕییە ناوخۆییەکان',intro:'ئەم ڕاپرسییە نەناسراو و خۆبەخشانەیە. هیچ وەڵامێک ڕاست یان هەڵە نییە: ئێمە سەرنجمان بۆ بۆچوونی تایبەتی تۆیە. دەتوانیت هەر پرسیارێک بپەڕێنیت و لە هەر کاتێکدا بوەستیت. مەبەست لە «گۆڕانکارییەکان» ئەو گۆڕانکارییانەیە کە ڕەنگە لە بینا، دوکان، شوێنە گشتییەکان، ژێرخان و کارکردەکانی ناوچەکەدا ڕووبدەن. ئەمە ماناکەی ئەوە نییە کە هەموو ئەو گۆڕانکارییانە جێبەجێ دەکرێن.',start:'دەستپێبکە',next:'دواتر',back:'گەڕانەوە',finish:'تەواوکردن',other:'تکایە ڕوونی بکەرەوە',max:'ئەوپەڕی {n} هەڵبژێرە',thanks:'سوپاس بۆ بەشداریکردنت! وەڵامەکانت یارمەتیمان دەدەن باشتر لە پێداویستییەکانی ئەو کەسانە تێبگەین کە لە نزیک ئەم ناوچەیە دەژین، لێرە کار دەکەن یان بەردەوام سەردانی دەکەن.',copy:'لەبەرگرتنەوەی وەڵامەکان',opt:'پرسیاری ئارەزوومەندانە'},
s1:['١ — بە هیچ شێوەیەک هاوڕا نیم','٢ — تا ڕادەیەک هاوڕا نیم','٣ — نە هاوڕام نە هاوڕا نیم','٤ — تا ڕادەیەک هاوڕام','٥ — بە تەواوی هاوڕام','نازانم'],
s2:['١ — هیچ نیگەران نیم','٢ — زۆر نیگەران نیم','٣ — تا ڕادەیەک نیگەرانم','٤ — زۆر نیگەرانم','٥ — بە توندی نیگەرانم','چاوەڕێی ئەم ئەنجامە ناکەم','نازانم'],
q:{1:{q:'کام ناوەندی بازاڕ یان ناوچە سەرنجی ڕادەکێشێت؟',o:['ناوەندی بازاڕی پوهۆس (Puhos)، هێلسینکی','ناوەندی بازاڕی کۆنتولا (Kontula)، هێلسینکی','ناوەندی بازاڕی ئیتیس (Itis)، هێلسینکی','مۆڵی تریپلا (Mall of Tripla)، هێلسینکی','ناوەندی بازاڕی هاکونیلا (Hakunila)، ڤانتا','ناوەندی بازاڕی میورمانی (Myyrmanni)، ڤانتا','ناوەندی بازاڕی یومبۆ (Jumbo)، ڤانتا','ناوەندی بازاڕی ئەنتریسە (Entresse)، ئێسپۆ','ناوەندی بازاڕی سێللۆ (Sello)، ئێسپۆ','ناوەندی بازاڕی ئیسۆ ئۆمێنا (Iso Omena)، ئێسپۆ']},
2:{q:'چەند جار سەردانی ئەم ناوەندە بازاڕییە یان ناوچەی دەوروبەری دەکەیت؟',o:['هەموو ڕۆژێک یان نزیکەی هەموو ڕۆژێک','چەند جارێک لە هەفتەیەکدا','چەند جارێک لە مانگێکدا','کەمتر لە جارێک لە مانگێکدا','ئەمە یەکەم جارمە لێرەم']},
3:{q:'پەیوەندیت بەم شوێنەوە چییە؟',h:'دەتوانیت چەند بژاردەیەک هەڵبژێریت.',o:['لە نزیکەوە نیشتەجێم','لە نزیکەوە کار دەکەم','خاوەنی کارێکی ناوخۆییم','لە دوکان، قاوەخانە یان کارێکی ناوخۆیی تر کار دەکەم','بەردەوام لێرە کاڵا دەکڕم یان خزمەتگوزارییەکان بەکاردەهێنم','شوێنە گشتییەکان بەکاردەهێنم یان بەشداری ڕووداوەکان دەکەم','لە نزیکەوە دەخوێنم','هیتر']},
4:{q:'چەندە ماوەیە لەم ناوچەیەدا نیشتەجێیت، کار دەکەیت یان بەردەوام کات بەسەر دەبەیت؟',o:['کەمتر لە ساڵێک','١ بۆ ٥ ساڵ','زیاتر لە ٥ ساڵ','لە نزیکەوە نیشتەجێ نیم و کار ناکەم، بەڵام سەردانی ئەم شوێنە دەکەم','نازانم']},
5:{q:'بە گشتی، چەند لە دۆخی ئێستای ناوەندە بازاڕییەکە و ناوچەی دەوروبەری ڕازیت؟',o:['١ — بە هیچ شێوەیەک ڕازی نیم','٢ — تا ڕادەیەک ناڕازیم','٣ — نە ڕازیم نە ناڕازی','٤ — تا ڕادەیەک ڕازیم','٥ — بە تەواوی ڕازیم','نازانم']},
6:{q:'چی ئەم شوێنە بۆ تۆ بە تایبەتی تایبەت یان گرنگ دەکات؟',o:['لێرە دوکان و بەرهەمگەلێک هەیە کە لە شوێنی تر بە سەختی دەدۆزرێنەوە','لێرە دەتوانم بە زمانێکی گونجاو بۆ خۆم خزمەتگوزاری وەربگرم یان قسە بکەم','لێرە کولتوور، خواردن و داب‌ونەریتی جیاواز دەبینرێن','لێرە هاوڕێ، ناسیاو یان دراوسێکانم دەبینم','شوێنێکی گرنگە لە ژیانی ڕۆژانەمدا','لێرە کارە بچووک و سەربەخۆکان چالاکن','کاڵا و خزمەتگوزارییەکان لێرە ئەرزانن','تەلارسازی، کەشوهەوا یان ڕێکخستنی شوێنەکەم بەدڵە','لێرە ڕووداو یان چالاکی کولتووری سەرنجڕاکێش ڕێکدەخرێن','ئەم شوێنە هیچ گرنگییەکی تایبەتی بۆ من نییە','هیتر']},
7:{q:'تا چ ڕادەیەک لەگەڵ ئەم گوزارشتانەی خوارەوە هاوڕایت؟',r:['ئەم شوێنە بۆ ژیانی ڕۆژانەی کۆمەڵگەی ناوخۆیی گرنگە.','فرەیی کولتووری و زمانەوانی تایبەتمەندییەکی بەنرخی ئەم شوێنەیە.','هەست بە پەیوەندی بەم شوێنەوە دەکەم.','ئەم شوێنە ڕێگە بە خەڵکی خاوەن ئەزموونی جیاوازی ژیان دەدات یەکتر ببینن و پەیوەندی لەگەڵ یەکتر دروست بکەن.','کاتێک ناوچەکە دەگۆڕێت، گرنگە پێداویستی ئەو کەسانە لەبەرچاو بگیرێت کە ئێستا بەکاری دەهێنن.']},
8:{q:'ئەگەر گۆڕانکارییەکان لە ناوەندە بازاڕییەکە و ناوچەی دەوروبەری بە ئامانجی باشترکردنی بینا، شوێنە گشتییەکان و خزمەتگوزارییە ناوخۆییەکان بن، تا چەند پشتگیریان دەکەیت؟',o:['بە تەواوی پشتگیری دەکەم','تا ڕادەیەک پشتگیری دەکەم','نە پشتگیری دەکەم نە دژایەتی','تا ڕادەیەک دژایەتی دەکەم','بە توندی دژایەتی دەکەم','زانیاری پێویستم نییە بۆ وەڵامدانەوە']},
9:{q:'دەتەوێت سەرەتا چ گۆڕانکارییەک ببینیت؟',o:['نوێکردنەوە و باشترکردنی بیناکانی ئێستا','دوکان، قاوەخانە و چێشتخانەی نوێ','پاراستنی دوکانە بچووکە سەربەخۆکان و کرێی بازرگانی ئەرزان','شوێنی سەوزایی، دار و شوێنی پشوودان زیاتر','ڕێگای پیاسەی ڕەحەت‌تر و ژێرخانی پایسکل','شوێنی گشتی سەلامەت‌تر و خۆش‌تر','شوێنی زیاتر بۆ بینین، ڕووداو و چالاکی کولتووری','نیشتەجێبوونی نوێ لە نزیک ناوەندە بازاڕییەکە','گواستنەوەی گشتی باشتر و گەیشتنی ئاسان‌تر بە ناوچەکە','گەیشتنی باشتر بۆ ئەو کەسانەی جووڵەیان سنووردارە','پاراستنی ڕووخسار و کەشوهەوای ئێستا','پێویستی بە گۆڕانکاریی گەورە نییە','هیتر']},
10:{q:'ئەگەر گۆڕانکاری ڕوو بدات، پاراستنی چ شتێک بە تایبەتی گرنگە؟',h:'دەتوانیت چەند بژاردەیەک هەڵبژێریت.',o:['دوکان، قاوەخانە و چێشتخانەکانی ئێستا','کارە بچووک و سەربەخۆکان','نرخی ئەرزان بۆ کاڵا و خزمەتگوزارییەکان','فرەیی کولتووری و زمانەوانی','تەلارسازی و ڕووخساری مێژوویی','شوێنەکانی کۆبوونەوە و کۆمەڵایەتی','ئەو خزمەتگوزارییانەی بەردەوام بەکاریان دەهێنم','هەلی کار و دەرفەتی کارە ناوخۆییەکان','شوێنی گونجاو و گەیشتن بە گواستنەوە','هیچیان لەوانەی سەرەوە','هیتر']},
11:{q:'تا چەند لەم ئەگەرە ئەنجامانەی گۆڕانکارییەکان نیگەرانیت؟',r:['بەرزبوونەوەی نرخی کاڵا و خزمەتگوزارییەکان.','بەرزبوونەوەی کرێ بۆ کارە ناوخۆییەکان.','داخرانی دوکان و چێشتخانە ناسراوەکان.','کەمبوونەوەی ژمارەی کارە بچووک و سەربەخۆکان.','لەدەستدانی فرەیی کولتووری و زمانەوانی.','لەدەستدانی ئەو شوێنانەی خەڵک تێیدا یەکتر دەبینن و کۆمەڵایەتی دەکەن.','بەشداری ناتەواوی دانیشتووان و کارکەران لە بڕیاردان.','دەنگەدەنگ، تۆز و ناڕەحەتی کاتی لە کاتی کارە بیناسازییەکاندا.','زیادبوونی بار لەسەر گواستنەوە و ژێرخانی ناوخۆیی.','سەختبوونی گەیشتن بە ناوچەکە بۆ هەندێک گروپ.']},
12:{q:'وا دابنێ دوای نوێکردنەوە بینای نوێ و شوێنی گشتی خۆش‌تر دروست دەبێت، بەڵام ڕەنگە هەندێک لە دوکانەکانی ئێستا دابخرێن. کام شێواز هەڵدەبژێریت؟',o:['پشتگیری نوێکردنەوە دەکەم، با هەندێک دوکانی ئێستاش دابخرێن','پشتگیری نوێکردنەوە دەکەم ئەگەر ڕێوشوێن بۆ پاراستنی کارە هەبووەکان هەبێت','ناوچەکە هەنگاو بە هەنگاو نوێ دەکەمەوە و هەوڵ دەدەم زۆربەی دوکانەکانی ئێستا بپارێزم','پێم باشترە دۆخی ئێستا لەگەڵ باشترکردنی بچووک بپارێزرێت','نازانم','شێوازێکی تر']},
13:{q:'ئەگەر گۆڕانکارییەکان تێچووی کارە ناوخۆییەکان زیاد بکەن یان بەردەوامبوونیان سەخت بکەن، چ ڕێوشوێنێک دەبێت لەبەرچاو بگیرێت؟',o:['دابینکردنی شوێن بە کرێی ئەرزان بۆ کارە ناوخۆییەکان','پێشکەشکردنی شوێنی جێگرەوە لە نزیکەوە بۆ کارە هەبووەکان','ئەنجامدانی کارەکان بە قۆناغ بۆ ئەوەی کارەکان بەردەوام بن','پشتگیریکردنی ئەو کارکەرانەی دەبێت بگوازرێنەوە','هیچ ڕێوشوێنێکی تایبەت نییە: کارەکان دەبێت بەپێی مەرجە گشتییەکانی بازاڕ کار بکەن','پێویستی بەم ڕێوشوێنانە نییە','نازانم','هیتر']},
14:{q:'تا چەند لە پلانەکانی گۆڕانکاریی ئەگەری ئەم ناوەندە بازاڕییە یان ناوچەی دەوروبەری ئاگادارت؟',o:['زۆر باش لە پلانەکان ئاگادارم','دەربارەی پلانەکان بیستووم، بەڵام کەم دەزانم','دەربارەی پلانەکان نەمبیستووە','دڵنیا نیم']},
15:{q:'ئەگەر لە پلانەکان ئاگادارت، زانیاری دەربارەیان تا چەند بەردەست و تێگەیشتوو بوو؟',o:['زۆر بەردەست و تێگەیشتوو','تا ڕادەیەکی باش بەردەست و تێگەیشتوو','نە بەردەست نە نەبەردەست','تا ڕادەیەک سەخت یان ناڕوون','بە تەواوی نەبەردەست یان ناڕوون','لە پلانەکان ئاگادار نیم','نازانم']},
16:{q:'مەودای کاریگەری دانیشتووان و کارکەران لەسەر بڕیارەکانی داهاتووی ئەم ناوچەیە چۆن هەڵدەسەنگێنیت؟',o:['دەتوانن کاریگەری بەرچاو دروست بکەن','تا ڕادەیەک دەتوانن کاریگەری دروست بکەن','تەنها کەمێک دەتوانن کاریگەری دروست بکەن','لە کردەوەدا ناتوانن کاریگەری دروست بکەن','نازانم']},
17:{q:'ئەگەر بەشداریت لە گفتوگۆکانی داهاتووی ئەم ناوچەیە کردووە، تا چەند هەستت کرد کە بۆچوونەکەت بیسترا؟',o:['بۆچوونەکەم بە ڕادەیەکی زۆر لەبەرچاو گیرا','بۆچوونەکەم بەشێکی لەبەرچاو گیرا','بۆچوونەکەم بیسترا، بەڵام نازانم کاریگەری لەسەر بڕیارەکان هەبوو یان نا','بۆچوونەکەم لەبەرچاو نەگیرا','بەشدارییم کرد، بەڵام ناتوانم ئەنجامەکە هەڵبسەنگێنم','بەشداری گفتوگۆکان نەکردووە','نەمدەزانی دەرفەتی بەشداریکردن هەیە']},
18:{q:'دەتەوێت چۆن بەشداری گفتوگۆ بکەیت دەربارەی داهاتووی ئەم ناوچەیە؟',h:'دەتوانیت چەند بژاردەیەک هەڵبژێریت.',o:['ڕاپرسی ئۆنلاین','کۆبوونەوەی کراوە و گفتوگۆی گشتی','گفتوگۆ بە چەند زمانێک','گروپی کاری دانیشتووان و کارکەران','ڕاوێژ ڕاستەوخۆ لە ناوەندە بازاڕییەکەدا','چاوپێکەوتنی کورت لەگەڵ دانیشتووان و سەردانکەران','زانیاری و دەرفەتی پێدانی فیدباک بە ئۆنلاین','نامەوێت بەشداری بکەم','شێوازێکی تر']},
19:{q:'کام ئەنجامی گۆڕانکارییەکان بۆ تۆ پەسەندترین دەبێت؟',o:['ناوەندێکی بازاڕیی مۆدێرن لەگەڵ دوکان و خزمەتگوزاری نوێ','شوێنێکی گشتی خۆش‌تر لەگەڵ سەوزایی و شوێنی کۆبوونەوە','پاراستنی دوکانەکانی ئێستا و فرەیی کولتووری','تێکەڵەیەک لە مۆدێرنکردن و پاراستنی کارە ناوخۆییەکان و ناسنامەی ناوچەکە','پاراستنی دۆخی ئێستا لەگەڵ باشترکردنی بچووک','ئەنجامێکی تر','نازانم']},
20:{q:'بە بۆچوونی تۆ، چ شتێک بە تایبەتی گرنگە ڕێکخراوە شارەوانییەکان و لایەنەکانی تری بەشداربوو لە پلاندانان لەبەرچاوی بگرن کاتێک بڕیار دەدەن دەربارەی ئەم ناوچەیە؟'},

22:{q:'بە کام زمان یان زمانەکان دەتەوێت زانیاری دەربارەی پلانی شار وەربگریت؟',h:'دەتوانیت چەند بژاردەیەک هەڵبژێریت.',o:['فینلەندی','سویدی','ئینگلیزی','ڕووسی','ئێستۆنی','ئۆکرانی','سۆمالی','عەرەبی','هیندی','چینی (ماندارین)','فارسی','دەری','پەشتۆ','تاگالۆگ (فیلیپینی)','ئەلبانی','کوردی','تورکی','ڤیەتنامی','تایلەندی','ئیسپانی','بەنگالی','زمانێکی تر']},
23:{q:'بە شێوەیەکی گشتی لە ماڵەوە بە چ زمان یان زمانێک قسە دەکەیت؟'}}};

T.tr={ui:{title:'Yerel alışveriş merkezlerinin geleceği hakkında sakinlere ve ziyaretçilere yönelik anket',intro:'Bu anket anonim ve gönüllülük esasına dayalıdır. Doğru ya da yanlış cevap yoktur: kişisel görüşünüzle ilgileniyoruz. İstediğiniz soruyu atlayabilir ve istediğiniz zaman bırakabilirsiniz. “Değişiklikler”, binalarda, mağazalarda, kamusal alanlarda, altyapıda ve bölgenin işlevlerinde olabilecek değişiklikleri ifade eder. Bu, belirtilen tüm değişikliklerin uygulanacağı anlamına gelmez.',start:'Başla',next:'İleri',back:'Geri',finish:'Bitir',other:'Lütfen belirtin',max:'En fazla {n} seçin',thanks:'Katıldığınız için teşekkür ederiz! Cevaplarınız, bu bölgenin yakınında yaşayan, burada çalışan veya düzenli olarak ziyaret eden insanların ihtiyaçlarını daha iyi anlamamıza yardımcı olacak.',copy:'Cevapları kopyala',opt:'isteğe bağlı soru'},
s1:['1 — kesinlikle katılmıyorum','2 — biraz katılmıyorum','3 — ne katılıyorum ne katılmıyorum','4 — biraz katılıyorum','5 — kesinlikle katılıyorum','Bilmiyorum'],
s2:['1 — hiç endişelendirmiyor','2 — pek endişelendirmiyor','3 — biraz endişelendiriyor','4 — çok endişelendiriyor','5 — son derece endişelendiriyor','Böyle bir sonuç beklemiyorum','Bilmiyorum'],
q:{1:{q:'Hangi alışveriş merkezi veya bölge ilginizi çekiyor?',o:['Puhos Alışveriş Merkezi, Helsinki','Kontula Alışveriş Merkezi, Helsinki','Itis Alışveriş Merkezi, Helsinki','Mall of Tripla, Helsinki','Hakunila Alışveriş Merkezi, Vantaa','Myyrmanni Alışveriş Merkezi, Vantaa','Jumbo Alışveriş Merkezi, Vantaa','Entresse Alışveriş Merkezi, Espoo','Sello Alışveriş Merkezi, Espoo','Iso Omena Alışveriş Merkezi, Espoo']},
2:{q:'Bu alışveriş merkezini veya çevresini ne sıklıkla ziyaret ediyorsunuz?',o:['Her gün veya hemen hemen her gün','Haftada birkaç kez','Ayda birkaç kez','Ayda birden az','İlk kez buradayım']},
3:{q:'Bu yerle bağlantınız nedir?',h:'Birden fazla seçenek işaretleyebilirsiniz.',o:['Yakınlarda oturuyorum','Yakınlarda çalışıyorum','Yerel bir işletmenin sahibiyim','Yerel bir mağazada, kafede veya başka bir işletmede çalışıyorum','Burada düzenli olarak alışveriş yapıyorum veya hizmet alıyorum','Kamusal alanları kullanıyorum veya etkinliklere katılıyorum','Yakınlarda okuyorum','Diğer']},
4:{q:'Bu bölgede ne kadar süredir yaşıyorsunuz, çalışıyorsunuz veya düzenli olarak vakit geçiriyorsunuz?',o:['Bir yıldan az','1–5 yıl','5 yıldan fazla','Yakınlarda yaşamıyor ve çalışmıyorum, ama bu yeri ziyaret ediyorum','Bilmiyorum']},
5:{q:'Genel olarak alışveriş merkezinin ve çevresinin mevcut durumundan ne kadar memnunsunuz?',o:['1 — hiç memnun değilim','2 — biraz memnun değilim','3 — ne memnunum ne memnun değilim','4 — biraz memnunum','5 — tamamen memnunum','Bilmiyorum']},
6:{q:'Bu yeri sizin için kişisel olarak özel veya önemli kılan nedir?',o:['Burada başka yerlerde bulması zor mağazalar ve ürünler var','Burada bana uygun bir dilde hizmet alabiliyor veya iletişim kurabiliyorum','Burada farklı kültürler, mutfaklar ve gelenekler görülüyor','Burada arkadaşlarımla, tanıdıklarımla veya komşularımla buluşuyorum','Günlük hayatımda önemli bir yer','Burada küçük bağımsız işletmeler faaliyet gösteriyor','Burada mal ve hizmetler uygun fiyatlı','Mekânın mimarisini, atmosferini veya düzenini seviyorum','Burada ilginç etkinlikler veya kültürel faaliyetler düzenleniyor','Bu yerin benim için özel bir önemi yok','Diğer']},
7:{q:'Aşağıdaki ifadelere ne ölçüde katılıyorsunuz?',r:['Bu yer, yerel topluluğun günlük yaşamı için önemlidir.','Kültürel ve dilsel çeşitlilik bu yerin değerli bir özelliğidir.','Bu yere karşı bir bağ hissediyorum.','Bu yer, farklı yaşam deneyimlerine sahip insanların bir araya gelmesine ve etkileşim kurmasına olanak tanıyor.','Bölge değişirken, onu şu anda kullanan insanların ihtiyaçlarının dikkate alınması önemlidir.']},
8:{q:'Alışveriş merkezinde ve çevresinde yapılacak değişiklikler binaları, kamusal alanları ve yerel hizmetleri iyileştirmeyi amaçlıyorsa bunları ne ölçüde destekliyorsunuz?',o:['Tamamen destekliyorum','Biraz destekliyorum','Ne destekliyorum ne karşıyım','Biraz karşıyım','Kesinlikle karşıyım','Cevap vermek için yeterli bilgim yok']},
9:{q:'Önce hangi değişiklikleri görmek isterdiniz?',o:['Mevcut binaların yenilenmesi ve iyileştirilmesi','Yeni mağazalar, kafeler ve restoranlar','Küçük bağımsız mağazaların ve uygun fiyatlı ticari kiraların korunması','Daha fazla yeşil alan, ağaç ve dinlenme yeri','Daha rahat yaya yolları ve bisiklet altyapısı','Daha güvenli ve daha keyifli kamusal alan','Buluşma, etkinlik ve kültürel faaliyetler için daha fazla yer','Alışveriş merkezinin yakınında yeni konutlar','Daha iyi toplu taşıma ve bölgeye daha kolay erişim','Hareket kısıtlılığı olan kişiler için daha iyi erişilebilirlik','Mevcut görünümün ve atmosferin korunması','Büyük değişiklikler gerekli değil','Diğer']},
10:{q:'Olası değişikliklerde özellikle nelerin korunması önemlidir?',h:'Birden fazla seçenek işaretleyebilirsiniz.',o:['Mevcut mağazalar, kafeler ve restoranlar','Küçük bağımsız işletmeler','Mal ve hizmetlerin uygun fiyatları','Kültürel ve dilsel çeşitlilik','Tarihî mimari ve görünüm','Buluşma ve sosyalleşme yerleri','Düzenli olarak kullandığım hizmetler','İş yerleri ve yerel işletmeler için fırsatlar','Uygun konum ve ulaşım bağlantıları','Yukarıdakilerin hiçbiri','Diğer']},
11:{q:'Değişikliklerin aşağıdaki olası sonuçları sizi ne kadar endişelendiriyor?',r:['Mal ve hizmet fiyatlarının artması.','Yerel işletmeler için kiraların artması.','Tanıdık mağazaların ve restoranların kapanması.','Küçük bağımsız işletmelerin sayısının azalması.','Kültürel ve dilsel çeşitliliğin kaybı.','İnsanların buluştuğu ve sosyalleştiği yerlerin kaybı.','Sakinlerin ve girişimcilerin karar alma sürecine yeterince katılamaması.','İnşaat çalışmaları sırasında gürültü, toz ve geçici rahatsızlıklar.','Ulaşım ve yerel altyapıdaki yükün artması.','Bölgeye erişimin bazı gruplar için zorlaşması.']},
12:{q:'Yenilemeden sonra bölgede yeni binalar ve daha keyifli kamusal alanlar oluşacağını, ancak mevcut mağazaların bir kısmının kapanabileceğini düşünün. Hangi yaklaşımı seçerdiniz?',o:['Mevcut mağazaların bir kısmı kapansa bile yenilemeyi desteklerdim','Mevcut işletmeleri korumaya yönelik önlemler varsa yenilemeyi desteklerdim','Bölgeyi kademeli olarak yenilerdim ve mevcut mağazaların çoğunu korumaya çalışırdım','Küçük iyileştirmelerle mevcut durumun korunmasını tercih ederdim','Bilmiyorum','Başka bir yaklaşım']},
13:{q:'Değişiklikler yerel işletmelerin maliyetlerini artırıyor veya faaliyetlerini sürdürmelerini zorlaştırıyorsa hangi önlemler düşünülmelidir?',o:['Yerel işletmelere uygun kiralı mekânlar sunmak','Mevcut işletmelere yakınlarda alternatif mekânlar sunmak','İşletmelerin faaliyetlerine devam edebilmesi için çalışmaları aşamalar hâlinde yürütmek','Taşınmak zorunda kalan girişimcilere destek olmak','Özel bir önlem yok: işletmeler genel piyasa koşullarında faaliyet göstermeli','Bu tür önlemlere gerek yok','Bilmiyorum','Diğer']},
14:{q:'Bu alışveriş merkezinde veya çevresinde olası değişikliklere ilişkin planları ne kadar tanıyorsunuz?',o:['Planları iyi biliyorum','Planları duydum ama çok az şey biliyorum','Planları duymadım','Emin değilim']},
15:{q:'Planları biliyorsanız, bunlarla ilgili bilgiye erişim ve bilginin anlaşılırlığı nasıldı?',o:['Çok erişilebilir ve anlaşılır','Oldukça erişilebilir ve anlaşılır','Ne erişilebilir ne erişilemez','Biraz zor ulaşılır veya belirsiz','Tamamen erişilemez veya belirsiz','Planları bilmiyorum','Bilmiyorum']},
16:{q:'Sakinlerin ve girişimcilerin bu bölgenin geleceğine ilişkin kararları etkileme olanağını nasıl değerlendiriyorsunuz?',o:['Önemli ölçüde etkileyebilirler','Bir ölçüde etkileyebilirler','Yalnızca az etkileyebilirler','Pratikte etkileyemezler','Bilmiyorum']},
17:{q:'Bu bölgenin geleceğiyle ilgili görüşmelere katıldıysanız, görüşünüzün dinlendiğini ne kadar hissettiniz?',o:['Görüşüm büyük ölçüde dikkate alındı','Görüşüm kısmen dikkate alındı','Görüşüm dinlendi, ancak kararları etkileyip etkilemediğini bilmiyorum','Görüşüm dikkate alınmadı','Katıldım, ancak sonucu değerlendiremiyorum','Görüşmelere katılmadım','Katılım olanağından haberim yoktu']},
18:{q:'Bu bölgenin geleceğine ilişkin görüşmelere nasıl katılmak isterdiniz?',h:'Birden fazla seçenek işaretleyebilirsiniz.',o:['Çevrimiçi anketler','Açık toplantılar ve genel görüşmeler','Birden fazla dilde görüşmeler','Sakinlerden ve girişimcilerden oluşan çalışma grupları','Doğrudan alışveriş merkezinde yapılan istişareler','Sakinler ve ziyaretçilerle kısa görüşmeler','Bilgi ve çevrimiçi geri bildirim verme olanağı','Katılmak istemiyorum','Başka bir yol']},
19:{q:'Değişikliklerin hangi sonucu sizin için en kabul edilebilir olurdu?',o:['Yeni mağazaları ve hizmetleriyle modern bir alışveriş merkezi','Yeşil alanlar ve buluşma yerleriyle daha keyifli bir kamusal alan','Mevcut mağazaların ve kültürel çeşitliliğin korunması','Modernleşme ile yerel işletmelerin ve bölgenin kimliğinin korunmasının birleşimi','Küçük iyileştirmelerle mevcut durumun korunması','Başka bir sonuç','Bilmiyorum']},
20:{q:'Sizce, şehir yetkililerinin ve planlamaya katılan diğer tarafların bu bölge hakkında karar verirken özellikle neleri dikkate alması önemlidir?'},
21:{q:'Hangi yaş grubundasınız?',o:['18 yaş altı','18–29','30–44','45–59','60 veya üzeri','Cevap vermek istemiyorum']},
22:{q:'Kentsel planlamayla ilgili bilgiyi hangi dilde veya dillerde almak istersiniz?',h:'Birden fazla seçenek işaretleyebilirsiniz.',o:['Fince','İsveççe','İngilizce','Rusça','Estonca','Ukraynaca','Somalice','Arapça','Hintçe','Çince (Mandarin)','Farsça','Dari','Peştuca','Tagalogca (Filipince)','Arnavutça','Kürtçe','Türkçe','Vietnamca','Tayca','İspanyolca','Bengalce','Diğer dil']},
23:{q:'Evde genellikle hangi dili veya dilleri konuşuyorsunuz?'}}};

T.es={ui:{title:'Encuesta a residentes y visitantes sobre el futuro de los centros comerciales locales',intro:'Esta encuesta es anónima y voluntaria. No hay respuestas correctas ni incorrectas: nos interesa su opinión personal. Puede omitir cualquier pregunta y detenerse en cualquier momento. Por «cambios» se entienden los posibles cambios en edificios, tiendas, espacios públicos, infraestructura y funciones de la zona. Esto no significa que vayan a realizarse todos los cambios mencionados.',start:'Comenzar',next:'Siguiente',back:'Atrás',finish:'Finalizar',other:'Especifique',max:'Elija como máximo {n}',thanks:'¡Gracias por participar! Sus respuestas nos ayudarán a comprender mejor las necesidades de las personas que viven cerca de esta zona, trabajan en ella o la visitan con regularidad.',copy:'Copiar respuestas',opt:'pregunta opcional'},
s1:['1 — totalmente en desacuerdo','2 — algo en desacuerdo','3 — ni de acuerdo ni en desacuerdo','4 — algo de acuerdo','5 — totalmente de acuerdo','No sé'],
s2:['1 — nada preocupante','2 — poco preocupante','3 — algo preocupante','4 — muy preocupante','5 — extremadamente preocupante','No espero esta consecuencia','No sé'],
q:{1:{q:'¿Qué centro comercial o zona le interesa?',o:['Centro comercial Puhos, Helsinki','Centro comercial Kontula, Helsinki','Centro comercial Itis, Helsinki','Mall of Tripla, Helsinki','Centro comercial Hakunila, Vantaa','Centro comercial Myyrmanni, Vantaa','Centro comercial Jumbo, Vantaa','Centro comercial Entresse, Espoo','Centro comercial Sello, Espoo','Centro comercial Iso Omena, Espoo']},
2:{q:'¿Con qué frecuencia visita este centro comercial o sus alrededores?',o:['Todos los días o casi todos los días','Varias veces a la semana','Algunas veces al mes','Menos de una vez al mes','Es mi primera vez aquí']},
3:{q:'¿Cuál es su relación con este lugar?',h:'Puede elegir varias opciones.',o:['Vivo cerca','Trabajo cerca','Soy propietario/a de un negocio local','Trabajo en una tienda, cafetería u otro negocio local','Compro aquí con regularidad o uso sus servicios','Uso los espacios públicos o asisto a eventos','Estudio cerca','Otra']},
4:{q:'¿Desde hace cuánto tiempo vive, trabaja o pasa tiempo con regularidad en esta zona?',o:['Menos de un año','De 1 a 5 años','Más de 5 años','No vivo ni trabajo cerca, pero visito este lugar','No sé']},
5:{q:'En general, ¿qué tan satisfecho/a está con el estado actual del centro comercial y de sus alrededores?',o:['1 — nada satisfecho/a','2 — algo insatisfecho/a','3 — ni satisfecho/a ni insatisfecho/a','4 — algo satisfecho/a','5 — totalmente satisfecho/a','No sé']},
6:{q:'¿Qué hace que este lugar sea especial o importante para usted personalmente?',o:['Aquí hay tiendas y productos difíciles de encontrar en otros lugares','Aquí puedo recibir servicios o comunicarme en un idioma que me resulta cómodo','Aquí se ven diferentes culturas, cocinas y tradiciones','Aquí me encuentro con amigos, conocidos o vecinos','Es un lugar importante en mi vida diaria','Aquí funcionan pequeños negocios independientes','Los bienes y servicios aquí son asequibles','Me gusta la arquitectura, el ambiente o la distribución del espacio','Aquí se organizan eventos o actividades culturales interesantes','Este lugar no tiene un significado especial para mí','Otra']},
7:{q:'¿En qué medida está de acuerdo con las siguientes afirmaciones?',r:['Este lugar es importante para la vida diaria de la comunidad local.','La diversidad cultural y lingüística es una cualidad valiosa de este lugar.','Siento una conexión con este lugar.','Este lugar permite que personas con distintas experiencias de vida se encuentren e interactúen.','Cuando la zona cambia, es importante tener en cuenta las necesidades de las personas que la usan ahora.']},
8:{q:'¿En qué medida apoya los cambios en el centro comercial y sus alrededores si tienen como objetivo mejorar los edificios, los espacios públicos y los servicios locales?',o:['Los apoyo totalmente','Los apoyo en parte','Ni los apoyo ni me opongo','Me opongo en parte','Me opongo firmemente','No tengo información suficiente para responder']},
9:{q:'¿Qué cambios le gustaría ver primero?',o:['Renovación y mejora de los edificios existentes','Nuevas tiendas, cafeterías y restaurantes','Conservación de las pequeñas tiendas independientes y de alquileres comerciales asequibles','Más zonas verdes, árboles y lugares de descanso','Rutas peatonales más cómodas e infraestructura para bicicletas','Un espacio público más seguro y agradable','Más lugares para encuentros, eventos y actividades culturales','Nuevas viviendas cerca del centro comercial','Mejor transporte público y acceso más fácil a la zona','Mejor accesibilidad para personas con movilidad reducida','Conservación del aspecto y el ambiente actuales','No se necesitan cambios importantes','Otra']},
10:{q:'En caso de que haya cambios, ¿qué es especialmente importante conservar?',h:'Puede elegir varias opciones.',o:['Las tiendas, cafeterías y restaurantes actuales','Los pequeños negocios independientes','Precios asequibles de bienes y servicios','La diversidad cultural y lingüística','La arquitectura y el aspecto históricos','Los lugares de encuentro y convivencia','Los servicios que uso con regularidad','Los puestos de trabajo y las oportunidades para los negocios locales','La ubicación conveniente y las conexiones de transporte','Ninguna de las anteriores','Otra']},
11:{q:'¿Cuánto le preocupan las siguientes posibles consecuencias de los cambios?',r:['El aumento de los precios de bienes y servicios.','El aumento de los alquileres para los negocios locales.','El cierre de tiendas y restaurantes conocidos.','La disminución del número de pequeños negocios independientes.','La pérdida de la diversidad cultural y lingüística.','La pérdida de lugares donde las personas se encuentran y conviven.','La participación insuficiente de residentes y emprendedores en la toma de decisiones.','El ruido, el polvo y las molestias temporales durante las obras.','El aumento de la carga sobre el transporte y la infraestructura local.','El empeoramiento del acceso a la zona para algunos grupos.']},
12:{q:'Imagine que después de la renovación aparecerán nuevos edificios y espacios públicos más agradables, pero algunas de las tiendas actuales podrían cerrar. ¿Qué enfoque elegiría?',o:['Apoyaría la renovación, aunque cerraran algunas tiendas actuales','Apoyaría la renovación si hubiera medidas para proteger los negocios existentes','Renovaría la zona poco a poco e intentaría conservar la mayoría de las tiendas actuales','Preferiría mantener la situación actual con pequeñas mejoras','No sé','Otro enfoque']},
13:{q:'¿Qué medidas deberían considerarse si los cambios aumentan los costos de los negocios locales o les dificultan continuar su actividad?',o:['Ofrecer locales en alquiler asequible a los negocios locales','Ofrecer a los negocios existentes locales alternativos cercanos','Realizar las obras por etapas para que los negocios puedan seguir funcionando','Apoyar a los emprendedores que tengan que trasladarse','Ninguna medida especial: los negocios deben operar en condiciones generales de mercado','No se necesitan tales medidas','No sé','Otra']},
14:{q:'¿Qué tan bien conoce los planes de posibles cambios en este centro comercial o sus alrededores?',o:['Conozco bien los planes','He oído hablar de los planes, pero sé poco','No he oído hablar de los planes','No estoy seguro/a']},
15:{q:'Si conoce los planes, ¿qué tan accesible y comprensible fue la información sobre ellos?',o:['Muy accesible y comprensible','Bastante accesible y comprensible','Ni accesible ni inaccesible','Bastante difícil de encontrar o poco clara','Totalmente inaccesible o poco clara','No conozco los planes','No sé']},
16:{q:'¿Cómo valora las posibilidades de los residentes y emprendedores de influir en las decisiones sobre el futuro de esta zona?',o:['Pueden influir de forma significativa','Pueden influir hasta cierto punto','Solo pueden influir poco','En la práctica no pueden influir','No lo sé']},
17:{q:'Si ha participado en debates sobre el futuro de esta zona, ¿en qué medida sintió que se escuchó su opinión?',o:['Mi opinión se tuvo en cuenta en gran medida','Mi opinión se tuvo en cuenta en parte','Mi opinión fue escuchada, pero no sé si influyó en las decisiones','Mi opinión no se tuvo en cuenta','Participé, pero no puedo valorar el resultado','No he participado en los debates','No sabía que había oportunidad de participar']},
18:{q:'¿Cómo le gustaría participar en el debate sobre el futuro de esta zona?',h:'Puede elegir varias opciones.',o:['Encuestas en línea','Reuniones abiertas y debates públicos','Debates en varios idiomas','Grupos de trabajo de residentes y emprendedores','Consultas directamente en el centro comercial','Entrevistas breves con residentes y visitantes','Información y posibilidad de dar opiniones en línea','No quiero participar','Otra forma']},
19:{q:'¿Qué resultado de los cambios le resultaría más aceptable?',o:['Un centro comercial moderno con nuevas tiendas y servicios','Un espacio público más agradable con zonas verdes y lugares de encuentro','Conservación de las tiendas actuales y de la diversidad cultural','Una combinación de modernización y conservación de los negocios locales y de la identidad de la zona','Mantener la situación actual con pequeñas mejoras','Otro resultado','No sé']},
20:{q:'En su opinión, ¿qué es especialmente importante que las autoridades de la ciudad y los demás participantes en la planificación tengan en cuenta al tomar decisiones sobre esta zona?'},
21:{q:'¿A qué grupo de edad pertenece?',o:['Menos de 18','18–29','30–44','45–59','60 o más','Prefiero no responder']},
22:{q:'¿En qué idioma o idiomas preferiría recibir información sobre planificación urbana?',h:'Puede elegir varias opciones.',o:['Finés','Sueco','Inglés','Ruso','Estonio','Ucraniano','Somalí','Árabe','Hindi','Chino (mandarín)','Persa (farsi)','Dari','Pastún','Tagalo (filipino)','Albanés','Kurdo','Turco','Vietnamita','Tailandés','Español','Bengalí','Otro idioma']},
23:{q:'¿Qué idioma o idiomas habla normalmente en casa?'}}};

T.vi={ui:{title:'Khảo sát cư dân và khách tham quan về tương lai của các trung tâm thương mại địa phương',intro:'Khảo sát này ẩn danh và hoàn toàn tự nguyện. Không có câu trả lời đúng hay sai: chúng tôi quan tâm đến ý kiến cá nhân của bạn. Bạn có thể bỏ qua bất kỳ câu hỏi nào và dừng lại bất cứ lúc nào. “Thay đổi” là những thay đổi có thể xảy ra đối với các tòa nhà, cửa hàng, không gian công cộng, cơ sở hạ tầng và các chức năng của khu vực. Điều này không có nghĩa là tất cả các thay đổi được nêu sẽ được thực hiện.',start:'Bắt đầu',next:'Tiếp theo',back:'Quay lại',finish:'Hoàn tất',other:'Vui lòng nêu rõ',max:'Chọn tối đa {n}',thanks:'Cảm ơn bạn đã tham gia! Câu trả lời của bạn sẽ giúp chúng tôi hiểu rõ hơn nhu cầu của những người sống gần khu vực này, làm việc ở đây hoặc thường xuyên ghé thăm.',copy:'Sao chép câu trả lời',opt:'câu hỏi không bắt buộc'},
s1:['1 — hoàn toàn không đồng ý','2 — hơi không đồng ý','3 — không đồng ý cũng không phản đối','4 — hơi đồng ý','5 — hoàn toàn đồng ý','Không biết'],
s2:['1 — hoàn toàn không lo ngại','2 — không lo ngại lắm','3 — hơi lo ngại','4 — rất lo ngại','5 — cực kỳ lo ngại','Tôi không mong đợi hậu quả này','Không biết'],
q:{1:{q:'Bạn quan tâm đến trung tâm thương mại hoặc khu vực nào?',o:['Trung tâm thương mại Puhos, Helsinki','Trung tâm thương mại Kontula, Helsinki','Trung tâm thương mại Itis, Helsinki','Mall of Tripla, Helsinki','Trung tâm thương mại Hakunila, Vantaa','Trung tâm thương mại Myyrmanni, Vantaa','Trung tâm thương mại Jumbo, Vantaa','Trung tâm thương mại Entresse, Espoo','Trung tâm thương mại Sello, Espoo','Trung tâm thương mại Iso Omena, Espoo']},
2:{q:'Bạn đến trung tâm thương mại này hoặc khu vực xung quanh thường xuyên như thế nào?',o:['Mỗi ngày hoặc gần như mỗi ngày','Vài lần mỗi tuần','Vài lần mỗi tháng','Ít hơn một lần mỗi tháng','Đây là lần đầu tôi đến đây']},
3:{q:'Mối liên hệ của bạn với nơi này là gì?',h:'Bạn có thể chọn nhiều đáp án.',o:['Tôi sống gần đây','Tôi làm việc gần đây','Tôi là chủ một doanh nghiệp địa phương','Tôi làm việc tại một cửa hàng, quán cà phê hoặc doanh nghiệp địa phương khác','Tôi thường xuyên mua hàng hoặc sử dụng dịch vụ ở đây','Tôi sử dụng các không gian công cộng hoặc tham dự các sự kiện','Tôi học gần đây','Khác']},
4:{q:'Bạn đã sống, làm việc hoặc thường xuyên dành thời gian ở khu vực này được bao lâu?',o:['Dưới một năm','1–5 năm','Hơn 5 năm','Tôi không sống hay làm việc gần đây, nhưng tôi đến nơi này','Không biết']},
5:{q:'Nhìn chung, bạn hài lòng đến mức nào với tình trạng hiện tại của trung tâm thương mại và khu vực xung quanh?',o:['1 — hoàn toàn không hài lòng','2 — hơi không hài lòng','3 — không hài lòng cũng không bất mãn','4 — hơi hài lòng','5 — hoàn toàn hài lòng','Không biết']},
6:{q:'Điều gì khiến nơi này đặc biệt hoặc quan trọng đối với cá nhân bạn?',o:['Ở đây có những cửa hàng và sản phẩm khó tìm thấy ở nơi khác','Ở đây tôi có thể nhận dịch vụ hoặc giao tiếp bằng ngôn ngữ phù hợp với mình','Ở đây có thể thấy nhiều nền văn hóa, ẩm thực và truyền thống khác nhau','Ở đây tôi gặp bạn bè, người quen hoặc hàng xóm','Đây là nơi quan trọng trong cuộc sống hằng ngày của tôi','Ở đây có các doanh nghiệp nhỏ độc lập hoạt động','Hàng hóa và dịch vụ ở đây có giá phải chăng','Tôi thích kiến trúc, bầu không khí hoặc cách bố trí của nơi này','Ở đây tổ chức các sự kiện hoặc hoạt động văn hóa thú vị','Nơi này không có ý nghĩa đặc biệt đối với tôi','Khác']},
7:{q:'Bạn đồng ý đến mức nào với các nhận định sau?',r:['Nơi này quan trọng đối với cuộc sống hằng ngày của cộng đồng địa phương.','Sự đa dạng văn hóa và ngôn ngữ là một nét giá trị của nơi này.','Tôi cảm thấy gắn bó với nơi này.','Nơi này giúp những người có trải nghiệm sống khác nhau gặp gỡ và tương tác với nhau.','Khi khu vực thay đổi, điều quan trọng là phải tính đến nhu cầu của những người đang sử dụng nơi này.']},
8:{q:'Bạn ủng hộ đến mức nào những thay đổi tại trung tâm thương mại và khu vực xung quanh nếu chúng nhằm cải thiện các tòa nhà, không gian công cộng và dịch vụ địa phương?',o:['Hoàn toàn ủng hộ','Hơi ủng hộ','Không ủng hộ cũng không phản đối','Hơi phản đối','Phản đối mạnh mẽ','Tôi không có đủ thông tin để trả lời']},
9:{q:'Bạn muốn thấy những thay đổi nào trước tiên?',o:['Cải tạo và nâng cấp các tòa nhà hiện có','Các cửa hàng, quán cà phê và nhà hàng mới','Giữ lại các cửa hàng nhỏ độc lập và giá thuê mặt bằng phải chăng','Thêm không gian xanh, cây cối và chỗ nghỉ ngơi','Lối đi bộ thuận tiện hơn và hạ tầng xe đạp','Không gian công cộng an toàn và dễ chịu hơn','Thêm nơi gặp gỡ, tổ chức sự kiện và hoạt động văn hóa','Nhà ở mới gần trung tâm thương mại','Giao thông công cộng tốt hơn và dễ đến khu vực hơn','Khả năng tiếp cận tốt hơn cho người có khó khăn về vận động','Giữ nguyên diện mạo và bầu không khí hiện tại','Không cần thay đổi lớn','Khác']},
10:{q:'Nếu có thay đổi, điều gì đặc biệt quan trọng cần được giữ lại?',h:'Bạn có thể chọn nhiều đáp án.',o:['Các cửa hàng, quán cà phê và nhà hàng hiện có','Các doanh nghiệp nhỏ độc lập','Giá cả phải chăng cho hàng hóa và dịch vụ','Sự đa dạng văn hóa và ngôn ngữ','Kiến trúc và diện mạo lịch sử','Những nơi gặp gỡ và giao lưu','Các dịch vụ mà tôi thường xuyên sử dụng','Việc làm và cơ hội cho doanh nghiệp địa phương','Vị trí thuận tiện và kết nối giao thông','Không điều nào ở trên','Khác']},
11:{q:'Bạn lo ngại đến mức nào về những hậu quả có thể xảy ra sau đây của các thay đổi?',r:['Giá hàng hóa và dịch vụ tăng.','Tiền thuê mặt bằng của các doanh nghiệp địa phương tăng.','Các cửa hàng và nhà hàng quen thuộc đóng cửa.','Số lượng doanh nghiệp nhỏ độc lập giảm.','Mất đi sự đa dạng văn hóa và ngôn ngữ.','Mất đi những nơi mọi người gặp gỡ và giao lưu.','Cư dân và doanh nhân không được tham gia đầy đủ vào việc ra quyết định.','Tiếng ồn, bụi và sự bất tiện tạm thời trong quá trình thi công.','Áp lực gia tăng lên giao thông và hạ tầng địa phương.','Việc tiếp cận khu vực trở nên khó khăn hơn đối với một số nhóm.']},
12:{q:'Hãy hình dung sau khi cải tạo sẽ có các tòa nhà mới và không gian công cộng dễ chịu hơn, nhưng một số cửa hàng hiện có có thể đóng cửa. Bạn sẽ chọn cách tiếp cận nào?',o:['Tôi sẽ ủng hộ việc cải tạo, ngay cả khi một số cửa hàng hiện có đóng cửa','Tôi sẽ ủng hộ việc cải tạo nếu có biện pháp bảo vệ các doanh nghiệp hiện có','Tôi sẽ cải tạo khu vực dần dần và cố gắng giữ lại phần lớn các cửa hàng hiện có','Tôi muốn giữ nguyên hiện trạng với những cải thiện nhỏ','Không biết','Cách tiếp cận khác']},
13:{q:'Cần cân nhắc những biện pháp nào nếu các thay đổi làm tăng chi phí của doanh nghiệp địa phương hoặc khiến họ khó tiếp tục hoạt động?',o:['Cung cấp mặt bằng cho thuê giá phải chăng cho các doanh nghiệp địa phương','Cung cấp mặt bằng thay thế gần đó cho các doanh nghiệp hiện có','Thực hiện công việc theo từng giai đoạn để doanh nghiệp có thể tiếp tục hoạt động','Hỗ trợ các doanh nhân phải di dời','Không có biện pháp đặc biệt: doanh nghiệp phải hoạt động theo điều kiện thị trường chung','Không cần các biện pháp như vậy','Không biết','Khác']},
14:{q:'Bạn nắm rõ đến mức nào các kế hoạch về những thay đổi có thể xảy ra tại trung tâm thương mại này hoặc khu vực xung quanh?',o:['Tôi nắm rõ các kế hoạch','Tôi có nghe về các kế hoạch nhưng biết rất ít','Tôi chưa nghe về các kế hoạch','Tôi không chắc']},
15:{q:'Nếu bạn biết về các kế hoạch, thông tin về chúng dễ tiếp cận và dễ hiểu đến mức nào?',o:['Rất dễ tiếp cận và dễ hiểu','Khá dễ tiếp cận và dễ hiểu','Không dễ cũng không khó tiếp cận','Khá khó tìm hoặc không rõ ràng','Hoàn toàn không thể tiếp cận hoặc không rõ ràng','Tôi không biết về các kế hoạch','Không biết']},
16:{q:'Bạn đánh giá thế nào về khả năng của cư dân và doanh nhân trong việc tác động đến các quyết định về tương lai của khu vực này?',o:['Họ có thể tác động đáng kể','Họ có thể tác động ở một mức độ nào đó','Họ chỉ có thể tác động rất ít','Trên thực tế họ không thể tác động','Tôi không biết']},
17:{q:'Nếu bạn đã tham gia thảo luận về tương lai của khu vực này, bạn cảm thấy ý kiến của mình được lắng nghe đến mức nào?',o:['Ý kiến của tôi được xem xét ở mức độ lớn','Ý kiến của tôi được xem xét một phần','Ý kiến của tôi được lắng nghe, nhưng tôi không biết nó có ảnh hưởng đến các quyết định hay không','Ý kiến của tôi không được xem xét','Tôi đã tham gia nhưng không thể đánh giá kết quả','Tôi chưa tham gia các cuộc thảo luận','Tôi không biết có cơ hội tham gia']},
18:{q:'Bạn muốn tham gia thảo luận về tương lai của khu vực này bằng cách nào?',h:'Bạn có thể chọn nhiều đáp án.',o:['Khảo sát trực tuyến','Các buổi họp mở và thảo luận công khai','Thảo luận bằng nhiều ngôn ngữ','Các nhóm làm việc của cư dân và doanh nhân','Tham vấn trực tiếp tại trung tâm thương mại','Phỏng vấn ngắn với cư dân và khách tham quan','Thông tin và cơ hội góp ý trực tuyến','Tôi không muốn tham gia','Cách khác']},
19:{q:'Kết quả nào của các thay đổi sẽ là dễ chấp nhận nhất đối với bạn?',o:['Một trung tâm thương mại hiện đại với các cửa hàng và dịch vụ mới','Không gian công cộng dễ chịu hơn với cây xanh và nơi gặp gỡ','Giữ lại các cửa hàng hiện có và sự đa dạng văn hóa','Kết hợp hiện đại hóa với việc giữ gìn các doanh nghiệp địa phương và bản sắc khu vực','Giữ nguyên hiện trạng với những cải thiện nhỏ','Kết quả khác','Không biết']},
20:{q:'Theo bạn, điều gì đặc biệt quan trọng mà chính quyền thành phố và các bên tham gia quy hoạch cần cân nhắc khi ra quyết định về khu vực này?'},
21:{q:'Bạn thuộc nhóm tuổi nào?',o:['Dưới 18','18–29','30–44','45–59','60 trở lên','Tôi không muốn trả lời']},
22:{q:'Bạn muốn nhận thông tin về quy hoạch đô thị bằng ngôn ngữ nào?',h:'Bạn có thể chọn nhiều đáp án.',o:['Tiếng Phần Lan','Tiếng Thụy Điển','Tiếng Anh','Tiếng Nga','Tiếng Estonia','Tiếng Ukraina','Tiếng Somali','Tiếng Ả Rập','Tiếng Hindi','Tiếng Trung (Quan Thoại)','Tiếng Ba Tư (Farsi)','Tiếng Dari','Tiếng Pashto','Tiếng Tagalog (Philippines)','Tiếng Albania','Tiếng Kurd','Tiếng Thổ Nhĩ Kỳ','Tiếng Việt','Tiếng Thái','Tiếng Tây Ban Nha','Tiếng Bengal','Ngôn ngữ khác']},
23:{q:'Ở nhà bạn thường nói ngôn ngữ nào?'}}};

T.th={ui:{title:'แบบสำรวจความคิดเห็นของผู้อยู่อาศัยและผู้มาเยือนเกี่ยวกับอนาคตของศูนย์การค้าในท้องถิ่น',intro:'แบบสำรวจนี้ไม่ระบุชื่อและเป็นไปโดยสมัครใจ ไม่มีคำตอบที่ถูกหรือผิด เราสนใจความคิดเห็นส่วนตัวของคุณ คุณสามารถข้ามคำถามใดก็ได้และหยุดเมื่อใดก็ได้ “การเปลี่ยนแปลง” หมายถึงการเปลี่ยนแปลงที่อาจเกิดขึ้นกับอาคาร ร้านค้า พื้นที่สาธารณะ โครงสร้างพื้นฐาน และหน้าที่ของพื้นที่ ซึ่งไม่ได้หมายความว่าการเปลี่ยนแปลงทั้งหมดที่กล่าวถึงจะถูกดำเนินการ',start:'เริ่ม',next:'ถัดไป',back:'ย้อนกลับ',finish:'เสร็จสิ้น',other:'โปรดระบุ',max:'เลือกได้สูงสุด {n} ข้อ',thanks:'ขอบคุณที่เข้าร่วม! คำตอบของคุณจะช่วยให้เราเข้าใจความต้องการของผู้ที่อาศัยอยู่ใกล้พื้นที่นี้ ทำงานที่นี่ หรือมาเยือนเป็นประจำได้ดียิ่งขึ้น',copy:'คัดลอกคำตอบ',opt:'คำถามที่ไม่บังคับ'},
s1:['1 — ไม่เห็นด้วยอย่างยิ่ง','2 — ไม่เห็นด้วยบ้าง','3 — ไม่เห็นด้วยและไม่คัดค้าน','4 — เห็นด้วยบ้าง','5 — เห็นด้วยอย่างยิ่ง','ไม่ทราบ'],
s2:['1 — ไม่น่ากังวลเลย','2 — ไม่ค่อยน่ากังวล','3 — น่ากังวลเล็กน้อย','4 — น่ากังวลมาก','5 — น่ากังวลอย่างยิ่ง','ฉันไม่คาดว่าจะเกิดผลลัพธ์นี้','ไม่ทราบ'],
q:{1:{q:'คุณสนใจศูนย์การค้าหรือพื้นที่ใด',o:['ศูนย์การค้าพูโฮส (Puhos), เฮลซิงกิ','ศูนย์การค้าคอนทูลา (Kontula), เฮลซิงกิ','ศูนย์การค้าอิทิส (Itis), เฮลซิงกิ','มอลล์ออฟทริปลา (Mall of Tripla), เฮลซิงกิ','ศูนย์การค้าฮาคูนิลา (Hakunila), วานตา','ศูนย์การค้ามูร์มันนี (Myyrmanni), วานตา','ศูนย์การค้าจัมโบ้ (Jumbo), วานตา','ศูนย์การค้าเอนเทรสเซอ (Entresse), เอสโป','ศูนย์การค้าเซลโล (Sello), เอสโป','ศูนย์การค้าอีโซ โอเมนา (Iso Omena), เอสโป']},
2:{q:'คุณมาที่ศูนย์การค้าแห่งนี้หรือบริเวณโดยรอบบ่อยแค่ไหน',o:['ทุกวันหรือเกือบทุกวัน','สัปดาห์ละหลายครั้ง','เดือนละไม่กี่ครั้ง','น้อยกว่าเดือนละครั้ง','เป็นครั้งแรกที่มาที่นี่']},
3:{q:'คุณมีความเกี่ยวข้องกับสถานที่แห่งนี้อย่างไร',h:'คุณสามารถเลือกได้หลายข้อ',o:['อาศัยอยู่ใกล้ที่นี่','ทำงานอยู่ใกล้ที่นี่','เป็นเจ้าของธุรกิจในท้องถิ่น','ทำงานในร้านค้า ร้านกาแฟ หรือธุรกิจอื่นในท้องถิ่น','ซื้อสินค้าหรือใช้บริการที่นี่เป็นประจำ','ใช้พื้นที่สาธารณะหรือเข้าร่วมกิจกรรม','เรียนอยู่ใกล้ที่นี่','อื่น ๆ']},
4:{q:'คุณอาศัย ทำงาน หรือใช้เวลาอยู่ในพื้นที่นี้เป็นประจำมานานเท่าใด',o:['น้อยกว่าหนึ่งปี','1–5 ปี','มากกว่า 5 ปี','ไม่ได้อาศัยหรือทำงานใกล้ที่นี่ แต่มาที่สถานที่แห่งนี้','ไม่ทราบ']},
5:{q:'โดยรวมแล้ว คุณพอใจกับสภาพปัจจุบันของศูนย์การค้าและบริเวณโดยรอบมากแค่ไหน',o:['1 — ไม่พอใจเลย','2 — ค่อนข้างไม่พอใจ','3 — ไม่พอใจและไม่ไม่พอใจ','4 — ค่อนข้างพอใจ','5 — พอใจอย่างยิ่ง','ไม่ทราบ']},
6:{q:'อะไรที่ทำให้สถานที่แห่งนี้พิเศษหรือสำคัญสำหรับคุณเป็นการส่วนตัว',o:['ที่นี่มีร้านค้าและสินค้าที่หาได้ยากในที่อื่น','ที่นี่ฉันสามารถรับบริการหรือสื่อสารด้วยภาษาที่เหมาะกับฉันได้','ที่นี่เห็นวัฒนธรรม อาหาร และประเพณีที่หลากหลาย','ที่นี่ฉันพบเพื่อน คนรู้จัก หรือเพื่อนบ้าน','เป็นสถานที่สำคัญในชีวิตประจำวันของฉัน','ที่นี่มีธุรกิจขนาดเล็กอิสระดำเนินการอยู่','สินค้าและบริการที่นี่ราคาไม่แพง','ฉันชอบสถาปัตยกรรม บรรยากาศ หรือการจัดพื้นที่','ที่นี่มีกิจกรรมหรืองานวัฒนธรรมที่น่าสนใจ','สถานที่นี้ไม่มีความหมายพิเศษสำหรับฉัน','อื่น ๆ']},
7:{q:'คุณเห็นด้วยกับข้อความต่อไปนี้มากน้อยเพียงใด',r:['สถานที่แห่งนี้สำคัญต่อชีวิตประจำวันของชุมชนท้องถิ่น','ความหลากหลายทางวัฒนธรรมและภาษาเป็นคุณลักษณะอันทรงคุณค่าของสถานที่แห่งนี้','ฉันรู้สึกผูกพันกับสถานที่แห่งนี้','สถานที่แห่งนี้เปิดโอกาสให้ผู้คนที่มีประสบการณ์ชีวิตต่างกันได้พบปะและมีปฏิสัมพันธ์กัน','เมื่อพื้นที่เปลี่ยนแปลง สิ่งสำคัญคือต้องคำนึงถึงความต้องการของผู้ที่ใช้พื้นที่อยู่ในปัจจุบัน']},
8:{q:'คุณสนับสนุนการเปลี่ยนแปลงในศูนย์การค้าและบริเวณโดยรอบมากน้อยเพียงใด หากมีเป้าหมายเพื่อปรับปรุงอาคาร พื้นที่สาธารณะ และบริการในท้องถิ่น',o:['สนับสนุนอย่างเต็มที่','สนับสนุนบ้าง','ไม่สนับสนุนและไม่คัดค้าน','คัดค้านบ้าง','คัดค้านอย่างยิ่ง','ฉันมีข้อมูลไม่เพียงพอที่จะตอบ']},
9:{q:'คุณอยากเห็นการเปลี่ยนแปลงอะไรเป็นอันดับแรก',o:['การปรับปรุงและซ่อมแซมอาคารที่มีอยู่','ร้านค้า ร้านกาแฟ และร้านอาหารใหม่','การรักษาร้านค้าขนาดเล็กอิสระและค่าเช่าเชิงพาณิชย์ที่ไม่แพง','พื้นที่สีเขียว ต้นไม้ และที่พักผ่อนมากขึ้น','ทางเดินเท้าที่สะดวกขึ้นและโครงสร้างพื้นฐานสำหรับจักรยาน','พื้นที่สาธารณะที่ปลอดภัยและน่าอยู่ขึ้น','สถานที่สำหรับพบปะ จัดกิจกรรม และกิจกรรมทางวัฒนธรรมมากขึ้น','ที่อยู่อาศัยใหม่ใกล้ศูนย์การค้า','ระบบขนส่งสาธารณะที่ดีขึ้นและเข้าถึงพื้นที่ได้ง่ายขึ้น','การเข้าถึงที่ดีขึ้นสำหรับผู้ที่มีข้อจำกัดด้านการเคลื่อนไหว','การรักษารูปลักษณ์และบรรยากาศปัจจุบัน','ไม่จำเป็นต้องมีการเปลี่ยนแปลงครั้งใหญ่','อื่น ๆ']},
10:{q:'หากมีการเปลี่ยนแปลง สิ่งใดที่สำคัญเป็นพิเศษที่ต้องรักษาไว้',h:'คุณสามารถเลือกได้หลายข้อ',o:['ร้านค้า ร้านกาแฟ และร้านอาหารที่มีอยู่','ธุรกิจขนาดเล็กอิสระ','ราคาสินค้าและบริการที่ไม่แพง','ความหลากหลายทางวัฒนธรรมและภาษา','สถาปัตยกรรมและรูปลักษณ์เชิงประวัติศาสตร์','สถานที่พบปะและสังสรรค์','บริการที่ฉันใช้เป็นประจำ','งานและโอกาสสำหรับธุรกิจท้องถิ่น','ทำเลที่สะดวกและการเดินทางที่เชื่อมต่อ','ไม่มีข้อใดข้างต้น','อื่น ๆ']},
11:{q:'ผลที่อาจเกิดขึ้นจากการเปลี่ยนแปลงต่อไปนี้ทำให้คุณกังวลมากน้อยเพียงใด',r:['ราคาสินค้าและบริการที่สูงขึ้น','ค่าเช่าของธุรกิจท้องถิ่นที่สูงขึ้น','การปิดตัวของร้านค้าและร้านอาหารที่คุ้นเคย','จำนวนธุรกิจขนาดเล็กอิสระที่ลดลง','การสูญเสียความหลากหลายทางวัฒนธรรมและภาษา','การสูญเสียสถานที่ที่ผู้คนพบปะและสังสรรค์กัน','การมีส่วนร่วมของผู้อยู่อาศัยและผู้ประกอบการในการตัดสินใจที่ไม่เพียงพอ','เสียง ฝุ่น และความไม่สะดวกชั่วคราวระหว่างการก่อสร้าง','ภาระต่อการจราจรและโครงสร้างพื้นฐานในท้องถิ่นที่เพิ่มขึ้น','การเข้าถึงพื้นที่ที่ยากขึ้นสำหรับบางกลุ่ม']},
12:{q:'ลองนึกภาพว่าหลังการปรับปรุงจะมีอาคารใหม่และพื้นที่สาธารณะที่น่าอยู่ขึ้น แต่ร้านค้าที่มีอยู่บางแห่งอาจต้องปิดตัว คุณจะเลือกแนวทางใด',o:['ฉันจะสนับสนุนการปรับปรุง แม้ร้านค้าที่มีอยู่บางแห่งจะปิดตัว','ฉันจะสนับสนุนการปรับปรุง หากมีมาตรการปกป้องธุรกิจที่มีอยู่','ฉันจะปรับปรุงพื้นที่ทีละน้อยและพยายามรักษาร้านค้าที่มีอยู่ส่วนใหญ่ไว้','ฉันจะเลือกรักษาสภาพปัจจุบันไว้พร้อมปรับปรุงเล็กน้อย','ไม่ทราบ','แนวทางอื่น']},
13:{q:'ควรพิจารณามาตรการใด หากการเปลี่ยนแปลงทำให้ต้นทุนของธุรกิจท้องถิ่นสูงขึ้นหรือทำให้ดำเนินกิจการต่อได้ยาก',o:['จัดหาพื้นที่เช่าราคาไม่แพงให้ธุรกิจท้องถิ่น','เสนอพื้นที่ทางเลือกใกล้เคียงให้ธุรกิจที่มีอยู่','ดำเนินงานเป็นระยะเพื่อให้ธุรกิจยังดำเนินกิจการต่อได้','ช่วยเหลือผู้ประกอบการที่ต้องย้าย','ไม่ต้องมีมาตรการพิเศษ: ธุรกิจควรดำเนินการตามเงื่อนไขตลาดทั่วไป','ไม่จำเป็นต้องมีมาตรการเช่นนี้','ไม่ทราบ','อื่น ๆ']},
14:{q:'คุณรู้จักแผนการเปลี่ยนแปลงที่อาจเกิดขึ้นในศูนย์การค้าแห่งนี้หรือบริเวณโดยรอบดีแค่ไหน',o:['รู้จักแผนเป็นอย่างดี','เคยได้ยินเกี่ยวกับแผน แต่รู้น้อย','ไม่เคยได้ยินเกี่ยวกับแผน','ไม่แน่ใจ']},
15:{q:'หากคุณรู้จักแผนเหล่านี้ ข้อมูลเกี่ยวกับแผนเข้าถึงได้ง่ายและเข้าใจได้มากน้อยเพียงใด',o:['เข้าถึงง่ายและเข้าใจง่ายมาก','ค่อนข้างเข้าถึงง่ายและเข้าใจง่าย','ไม่ง่ายและไม่ยากที่จะเข้าถึง','ค่อนข้างหายากหรือไม่ชัดเจน','เข้าถึงไม่ได้หรือไม่ชัดเจนเลย','ไม่รู้จักแผน','ไม่ทราบ']},
16:{q:'คุณประเมินโอกาสของผู้อยู่อาศัยและผู้ประกอบการในการมีอิทธิพลต่อการตัดสินใจเกี่ยวกับอนาคตของพื้นที่นี้อย่างไร',o:['สามารถมีอิทธิพลได้อย่างมาก','สามารถมีอิทธิพลได้ในระดับหนึ่ง','สามารถมีอิทธิพลได้เพียงเล็กน้อย','ในทางปฏิบัติไม่สามารถมีอิทธิพลได้','ไม่ทราบ']},
17:{q:'หากคุณเคยเข้าร่วมการหารือเกี่ยวกับอนาคตของพื้นที่นี้ คุณรู้สึกว่าความคิดเห็นของคุณได้รับการรับฟังมากน้อยเพียงใด',o:['ความคิดเห็นของฉันได้รับการพิจารณาเป็นส่วนใหญ่','ความคิดเห็นของฉันได้รับการพิจารณาบางส่วน','ความคิดเห็นของฉันได้รับการรับฟัง แต่ไม่ทราบว่ามีผลต่อการตัดสินใจหรือไม่','ความคิดเห็นของฉันไม่ได้รับการพิจารณา','ฉันเข้าร่วม แต่ประเมินผลลัพธ์ไม่ได้','ฉันไม่ได้เข้าร่วมการหารือ','ฉันไม่ทราบว่ามีโอกาสเข้าร่วม']},
18:{q:'คุณต้องการมีส่วนร่วมในการหารือเกี่ยวกับอนาคตของพื้นที่นี้อย่างไร',h:'คุณสามารถเลือกได้หลายข้อ',o:['แบบสำรวจออนไลน์','การประชุมเปิดและการหารือสาธารณะ','การหารือหลายภาษา','กลุ่มทำงานของผู้อยู่อาศัยและผู้ประกอบการ','การรับฟังความคิดเห็นโดยตรงที่ศูนย์การค้า','การสัมภาษณ์สั้น ๆ กับผู้อยู่อาศัยและผู้มาเยือน','ข้อมูลและโอกาสให้ข้อเสนอแนะทางออนไลน์','ฉันไม่ต้องการมีส่วนร่วม','วิธีอื่น']},
19:{q:'ผลลัพธ์ของการเปลี่ยนแปลงแบบใดที่คุณยอมรับได้มากที่สุด',o:['ศูนย์การค้าทันสมัยพร้อมร้านค้าและบริการใหม่','พื้นที่สาธารณะที่น่าอยู่ขึ้นพร้อมพื้นที่สีเขียวและที่พบปะ','การรักษาร้านค้าที่มีอยู่และความหลากหลายทางวัฒนธรรม','การผสมผสานระหว่างความทันสมัยกับการรักษาธุรกิจท้องถิ่นและอัตลักษณ์ของพื้นที่','การรักษาสภาพปัจจุบันไว้พร้อมปรับปรุงเล็กน้อย','ผลลัพธ์อื่น','ไม่ทราบ']},
20:{q:'ในความคิดเห็นของคุณ สิ่งใดที่เจ้าหน้าที่เมืองและผู้เกี่ยวข้องกับการวางแผนอื่น ๆ ควรคำนึงถึงเป็นพิเศษเมื่อตัดสินใจเกี่ยวกับพื้นที่นี้'},
21:{q:'คุณอยู่ในกลุ่มอายุใด',o:['ต่ำกว่า 18','18–29','30–44','45–59','60 ขึ้นไป','ไม่ประสงค์จะตอบ']},
22:{q:'คุณต้องการรับข้อมูลเกี่ยวกับการวางผังเมืองเป็นภาษาใด',h:'คุณสามารถเลือกได้หลายข้อ',o:['ภาษาฟินแลนด์','ภาษาสวีเดน','ภาษาอังกฤษ','ภาษารัสเซีย','ภาษาเอสโตเนีย','ภาษายูเครน','ภาษาโซมาลี','ภาษาอาหรับ','ภาษาฮินดี','ภาษาจีน (แมนดาริน)','ภาษาเปอร์เซีย (ฟาร์ซี)','ภาษาดารี','ภาษาปัชโต','ภาษาตากาล็อก (ฟิลิปปินส์)','ภาษาแอลเบเนีย','ภาษาเคิร์ด','ภาษาตุรกี','ภาษาเวียดนาม','ภาษาไทย','ภาษาสเปน','ภาษาเบงกอล','ภาษาอื่น']},
23:{q:'โดยปกติคุณพูดภาษาใดที่บ้าน'}}};

T.bn={ui:{title:'স্থানীয় শপিং সেন্টারগুলোর ভবিষ্যৎ নিয়ে বাসিন্দা ও দর্শনার্থীদের জরিপ',intro:'এই জরিপটি বেনামি ও স্বেচ্ছাভিত্তিক। কোনো উত্তরই সঠিক বা ভুল নয়: আমরা আপনার ব্যক্তিগত মতামত জানতে আগ্রহী। আপনি যেকোনো প্রশ্ন এড়িয়ে যেতে এবং যেকোনো সময় থামতে পারেন। “পরিবর্তন” বলতে ভবন, দোকান, গণপরিসর, অবকাঠামো এবং এলাকার কার্যক্রমে সম্ভাব্য পরিবর্তনগুলো বোঝানো হয়েছে। এর অর্থ এই নয় যে উল্লিখিত সব পরিবর্তন বাস্তবায়ন করা হবে।',start:'শুরু করুন',next:'পরবর্তী',back:'পিছনে',finish:'সমাপ্ত করুন',other:'অনুগ্রহ করে উল্লেখ করুন',max:'সর্বোচ্চ {n}টি বেছে নিন',thanks:'অংশগ্রহণের জন্য ধন্যবাদ! আপনার উত্তর আমাদের সাহায্য করবে এই এলাকার কাছাকাছি বসবাসকারী, এখানে কর্মরত বা নিয়মিত আসা মানুষের প্রয়োজন আরও ভালোভাবে বুঝতে।',copy:'উত্তর কপি করুন',opt:'ঐচ্ছিক প্রশ্ন'},
s1:['১ — সম্পূর্ণ অসম্মত','২ — কিছুটা অসম্মত','৩ — সম্মতও নই, অসম্মতও নই','৪ — কিছুটা সম্মত','৫ — সম্পূর্ণ সম্মত','জানি না'],
s2:['১ — মোটেও উদ্বেগজনক নয়','২ — তেমন উদ্বেগজনক নয়','৩ — কিছুটা উদ্বেগজনক','৪ — অত্যন্ত উদ্বেগজনক','৫ — চরম উদ্বেগজনক','আমি এমন পরিণতি আশা করি না','জানি না'],
q:{1:{q:'কোন শপিং সেন্টার বা এলাকা আপনার আগ্রহের?',o:['পুহোস শপিং সেন্টার (Puhos), হেলসিঙ্কি','কনটুলা শপিং সেন্টার (Kontula), হেলসিঙ্কি','ইতিস শপিং সেন্টার (Itis), হেলসিঙ্কি','মল অফ ট্রিপলা (Mall of Tripla), হেলসিঙ্কি','হাকুনিলা শপিং সেন্টার (Hakunila), ভান্তা','ম্যুরম্যান্নি শপিং সেন্টার (Myyrmanni), ভান্তা','জাম্বো শপিং সেন্টার (Jumbo), ভান্তা','এনট্রেসে শপিং সেন্টার (Entresse), এসপু','সেল্লো শপিং সেন্টার (Sello), এসপু','ইসো ওমেনা শপিং সেন্টার (Iso Omena), এসপু']},
2:{q:'আপনি এই শপিং সেন্টার বা এর আশপাশের এলাকায় কত ঘন ঘন যান?',o:['প্রতিদিন বা প্রায় প্রতিদিন','সপ্তাহে কয়েকবার','মাসে কয়েকবার','মাসে একবারের কম','এটি আমার প্রথমবার']},
3:{q:'এই জায়গার সঙ্গে আপনার সম্পর্ক কী?',h:'আপনি একাধিক বিকল্প বেছে নিতে পারেন।',o:['আমি কাছাকাছি থাকি','আমি কাছাকাছি কাজ করি','আমি একটি স্থানীয় ব্যবসার মালিক','আমি স্থানীয় দোকান, ক্যাফে বা অন্য ব্যবসায় কাজ করি','আমি এখানে নিয়মিত জিনিসপত্র কিনি বা সেবা নিই','আমি গণপরিসর ব্যবহার করি বা অনুষ্ঠানে যোগ দিই','আমি কাছাকাছি পড়াশোনা করি','অন্য']},
4:{q:'আপনি এই এলাকায় কতদিন ধরে বসবাস, কাজ বা নিয়মিত সময় কাটাচ্ছেন?',o:['এক বছরের কম','১–৫ বছর','৫ বছরের বেশি','আমি কাছাকাছি থাকি না বা কাজ করি না, তবে এই জায়গায় আসি','জানি না']},
5:{q:'সামগ্রিকভাবে, শপিং সেন্টার ও এর আশপাশের বর্তমান অবস্থা নিয়ে আপনি কতটা সন্তুষ্ট?',o:['১ — মোটেও সন্তুষ্ট নই','২ — কিছুটা অসন্তুষ্ট','৩ — সন্তুষ্টও নই, অসন্তুষ্টও নই','৪ — কিছুটা সন্তুষ্ট','৫ — সম্পূর্ণ সন্তুষ্ট','জানি না']},
6:{q:'কী এই জায়গাটিকে আপনার ব্যক্তিগতভাবে বিশেষ বা গুরুত্বপূর্ণ করে তোলে?',o:['এখানে এমন দোকান ও পণ্য আছে যা অন্য জায়গায় পাওয়া কঠিন','এখানে আমি আমার সুবিধাজনক ভাষায় সেবা নিতে বা যোগাযোগ করতে পারি','এখানে বিভিন্ন সংস্কৃতি, রান্না ও ঐতিহ্যের দেখা মেলে','এখানে আমি বন্ধু, পরিচিত বা প্রতিবেশীদের সঙ্গে দেখা করি','এটি আমার দৈনন্দিন জীবনে একটি গুরুত্বপূর্ণ জায়গা','এখানে ছোট স্বাধীন ব্যবসা চলে','এখানে পণ্য ও সেবার দাম সাধ্যের মধ্যে','আমি এই জায়গার স্থাপত্য, পরিবেশ বা বিন্যাস পছন্দ করি','এখানে আকর্ষণীয় অনুষ্ঠান বা সাংস্কৃতিক কার্যক্রম হয়','এই জায়গাটির আমার কাছে বিশেষ কোনো গুরুত্ব নেই','অন্য']},
7:{q:'নিচের বক্তব্যগুলোর সঙ্গে আপনি কতটা একমত?',r:['এই জায়গাটি স্থানীয় সম্প্রদায়ের দৈনন্দিন জীবনের জন্য গুরুত্বপূর্ণ।','সাংস্কৃতিক ও ভাষাগত বৈচিত্র্য এই জায়গার একটি মূল্যবান বৈশিষ্ট্য।','আমি এই জায়গার সঙ্গে একটি সংযোগ অনুভব করি।','এই জায়গা বিভিন্ন জীবনঅভিজ্ঞতার মানুষকে একে অপরের সঙ্গে দেখা ও মেলামেশার সুযোগ দেয়।','এলাকা বদলানোর সময় যারা এখন এটি ব্যবহার করছেন তাদের প্রয়োজন বিবেচনা করা গুরুত্বপূর্ণ।']},

9:{q:'আপনি প্রথমে কোন পরিবর্তনগুলো দেখতে চান?',o:['বিদ্যমান ভবনগুলোর সংস্কার ও উন্নয়ন','নতুন দোকান, ক্যাফে ও রেস্তোরাঁ','ছোট স্বাধীন দোকান এবং সাধ্যের মধ্যে বাণিজ্যিক ভাড়া বজায় রাখা','আরও সবুজ এলাকা, গাছ ও বিশ্রামের জায়গা','আরও সুবিধাজনক পথচারী পথ ও সাইকেলের অবকাঠামো','আরও নিরাপদ ও মনোরম গণপরিসর','দেখা-সাক্ষাৎ, অনুষ্ঠান ও সাংস্কৃতিক কার্যক্রমের জন্য আরও জায়গা','শপিং সেন্টারের কাছে নতুন আবাসন','আরও ভালো গণপরিবহন এবং এলাকায় সহজ প্রবেশাধিকার','সীমিত চলাচলের মানুষের জন্য আরও ভালো প্রবেশগম্যতা','বর্তমান চেহারা ও পরিবেশ বজায় রাখা','বড় পরিবর্তনের প্রয়োজন নেই','অন্য']},
